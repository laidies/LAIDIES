<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>KSVL 99.9 FM · Pop-Out Player · LAiDIES</title>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --plum: #4b2148; --plum-deep: #2a1226; --rose: #9b3f5f; --cream: #fffdfb; --gold: #d4a853; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; padding: 18px 18px 96px; box-sizing: border-box;
      background: linear-gradient(180deg, #2a1226 0%, #4b2148 100%);
      color: var(--cream); font-family: 'Jost', sans-serif; text-align: center;
    }
    .ksvl-pop-freq {
      font-size: 11px; font-weight: 800; letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--gold);
    }
    .ksvl-pop-name {
      margin: 0; font-size: 30px; font-weight: 800; letter-spacing: 0.08em; line-height: 1.1;
      color: #ff6ec7;
      text-shadow: 0 0 10px rgba(255,110,199,0.65), 0 0 26px rgba(255,110,199,0.35);
    }
    .ksvl-pop-motto {
      margin: 0; font-size: 12.5px; font-style: italic; color: rgba(255,253,251,0.85);
    }
    .ksvl-pop-note {
      margin: 8px 0 0; font-size: 11.5px; line-height: 1.55; color: rgba(255,253,251,0.62);
      max-width: 330px;
    }
  </style>
</head>
<body data-ksvl-popup>
  <span class="ksvl-pop-freq">★ KSVL · 99.9 FM · SUNNYVAiLE</span>
  <h1 class="ksvl-pop-name">Community RAiDIO</h1>
  <p class="ksvl-pop-motto">Don't just learn from books. Learn from hooks.</p>
  <p class="ksvl-pop-note">Keep this little window open and the station plays on while you wander the town. If the music arrived paused, click anywhere in here once.</p>
  <script defer src="/content/site/ksvl-player.js?v=20260705-21"></script>
</body>
</html>
