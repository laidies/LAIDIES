<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Big Question exact longform render</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Jost:ital,wght@0,400;0,600;0,700;0,800;1,400&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/content/newsstand.css">
  <style>
    body { margin: 0; }
    .review-shell { width: min(100% - 44px, 1220px); margin: 32px auto 80px; }
    .review-note { padding: 16px 20px; border: 3px solid var(--ns-ink); background: var(--ns-cyan); font-weight: 800; }
    .ns-article__section { align-items: start; }
    .ns-article__section > div > :first-child { margin-top: 0; }
    .ns-article__section > div > :last-child { margin-bottom: 0; }
    .ns-article__section p + p, .ns-article__section ul + p, .ns-article__section p + ul { margin-top: 1em; }
    .ns-article__section ul, .ns-article__section ol { margin: 0; padding-left: 1.4em; font-size: clamp(17px, 1.4vw, 20px); }
    .ns-article__section li + li { margin-top: .55em; }
    .ns-article__section blockquote { margin: 1.2em 0; padding: 18px 22px; border-left: 8px solid var(--ns-pink); background: #eef1ff; font-size: clamp(19px, 1.6vw, 23px); font-weight: 700; }
    .ns-article__section h4 { margin: 1.3em 0 .45em; color: var(--ns-purple); font-size: clamp(20px, 1.8vw, 28px); }
    @media (max-width: 760px) { .review-shell { width: calc(100% - 28px); margin-top: 18px; } }
  </style>
</head>
<body class="ns-page">
<main class="review-shell">
  <p class="review-note">Internal exact-prose review render · not a public page or publication claim</p>
  <article class="ns-article" id="article" aria-label="The Big Question candidate"></article>
</main>
<script>
  const SOURCE = "/operations/drafts/news-radar/2026-08-11-cross-lab-evaluation-boundaries/big-picture-draft.md";
  const escapeHTML = (value) => String(value).replace(/[&<>\"]/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[char]));
  function inline(value) {
    return escapeHTML(value)
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2">$1</a>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>');
  }
  function blocks(lines) {
    let html = "";
    for (let i = 0; i < lines.length;) {
      const line = lines[i].trim();
      if (!line || line === "---") { i += 1; continue; }
      if (/^### /.test(line)) { html += `<h4>${inline(line.slice(4))}</h4>`; i += 1; continue; }
      if (/^> /.test(line)) {
        const value = [];
        while (i < lines.length && /^>/.test(lines[i].trim())) value.push(lines[i++].trim().replace(/^> ?/, ""));
        html += `<blockquote>${inline(value.join(" "))}</blockquote>`; continue;
      }
      if (/^[-*] /.test(line) || /^\d+\. /.test(line)) {
        const ordered = /^\d+\. /.test(line); const items = [];
        while (i < lines.length && (ordered ? /^\d+\. /.test(lines[i].trim()) : /^[-*] /.test(lines[i].trim()))) {
          items.push(lines[i++].trim().replace(ordered ? /^\d+\. / : /^[-*] /, ""));
        }
        html += `<${ordered ? "ol" : "ul"}>${items.map((item) => `<li>${inline(item)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`; continue;
      }
      const paragraph = [line]; i += 1;
      while (i < lines.length && lines[i].trim() && !/^(#{1,3} |>|---$|[-*] |\d+\. )/.test(lines[i].trim())) paragraph.push(lines[i++].trim());
      html += `<p>${inline(paragraph.join(" "))}</p>`;
    }
    return html;
  }
  fetch(SOURCE).then((response) => response.text()).then((markdown) => {
    const lines = markdown.split(/\r?\n/); const title = lines.shift().replace(/^# /, "");
    while (lines[0] && !lines[0].trim()) lines.shift();
    const edition = lines.shift().replace(/^\*\*|\*\*$/g, "");
    const sections = []; let current = { heading: "The article", lines: [] };
    for (const line of lines) {
      if (/^## /.test(line)) { if (current.lines.some((item) => item.trim())) sections.push(current); current = { heading: line.slice(3), lines: [] }; }
      else current.lines.push(line);
    }
    if (current.lines.some((item) => item.trim())) sections.push(current);
    document.getElementById("article").innerHTML = `<header class="ns-article__head"><p class="ns-article__edition">${inline(edition)}</p><h2>${inline(title)}</h2><p>Exact candidate prose · checked through August 12, 2026</p></header>` +
      sections.map((section) => `<section class="ns-article__section"><h3>${inline(section.heading)}</h3><div>${blocks(section.lines)}</div></section>`).join("");
    document.documentElement.dataset.renderReady = "true";
  });
</script>
</body>
</html>
