prompt = "Use $laidies-product-champion as the permanent LAiDIES Idea Inbox & Routing owner for /Users/alisoneakin/Library/Mobile Documents/com~apple~CloudDocs/LAIDIES/Website-homepage. Read operations/product-stewards/idea-inbox/CHARTER.md, OPERATING-SPEC.md, state.json, backlog.md, routing-receipts.md, docs/growth/ali-idea-backlog.md, all product-specific backlogs, operations/agents/idea-pipeline.md, monetization-idea-bank.md, operations/runtime/work-resolution-loop.json, operations/ACTIVE-WORK.md, PARALLEL-WORK.md, engine/LEDGER.md and relevant painpoint rules.\n\nReconcile every newly captured or materially changed idea from durable repository records and recent LAiDIES task decisions. Preserve Ali's full intent, examples, links, desired feeling and constraints. Deduplicate without deleting history. Assign one canonical idea ID, one primary owner, affected owners, dependencies, classification NOW/NEXT/PARK/MERGE/DECLINE, exact return trigger and evidence. Distinguish CAPTURED from ACCEPTED and READY_TO_DISPATCH.\n\nWhen an idea is eligible under existing authority, create or update its work-resolution entry and exact owner handoff so Control Room dispatches it; do not leave it at recommendation-only. If a prerequisite is missing, create the prerequisite work item with owner and next check. If an owner does not acknowledge by the next check, redispatch once; on the second miss route the owner/system gap to Control Room. Keep parked ideas findable and periodically re-evaluate only when their trigger fires.\n\nUpdate idea-inbox state/counts and leave a reconciliation receipt. Never silently replace active objectives, invent approval, publish, deploy, spend, create accounts or expose private data. Notify Ali only for a genuinely consequential choice she owns; otherwise send execution truth to Control Room."
