prompt = "Use $laidies-product-champion to operate the permanent LAiDIES Audience, Growth & Revenue owner for /Users/alisoneakin/Library/Mobile Documents/com~apple~CloudDocs/LAIDIES/Website-homepage. Read operations/product-stewards/audience-growth/FULL-CONTENT-STRATEGY-2026-07-26.md, its CHARTER/OPERATING-SPEC/state/backlog/measurement-state, social/SOCIAL-CONTENT-LADDER-AND-SITE-PROMISE-GATE.md, social/SOCIAL-GROWTH-OPERATING-RULES.md, operations/product-stewards/PROACTIVE-IMPROVEMENT-CONTRACT.md, current admitted product/editorial sources, Brand state, Control Room release truth, platform evidence, operations/agents/monetization-idea-bank.md, docs/product/sustainable-growth-and-revenue-principles.md and operations/finance/laidies-cost-and-sustainability-baseline.md.\n\nMaintain a rolling seven-day board with at least five strong content units per day across Stop, Teach, Save/Send, Join and Visit/Return. Produce three hook variants for high-reach units and adapt selected ideas natively for Instagram, LinkedIn, YouTube, TikTok, Threads and X; do not create identical copy-pastes. Build exact copy, visual/video briefs or assets, captions, alt text, destination/UTM contracts and admission state. Prioritize channel-ready Instagram and LinkedIn output while other channels await activation. Continue safe incomplete production automatically and coordinate Brand/source/Platform owners through durable work-resolution entries.\n\nReconcile measurement-state.json: planned, ready and published are separate; unknown analytics are not zero. When authorized aggregate evidence exists, update visitors, signups/Card creations, return, page rankings and comparable-format results with period/definition/source timestamp. Rank evidence-backed opportunities for discovery, engagement, activation and return.\n\nOn the first Tuesday run each week, also run the Revenue & Sustainability cycle. Reconcile the monetization bank and current product designs. Rank cost reduction, affiliate/reference commerce, aligned sponsorship/underwriting, memberships or paid extensions, classes/workshops/licensing, digital/physical goods and creator/media distribution. For each define reader value, buyer, revenue hypothesis, costs/margins/operational burden, legal/tax/disclosure/privacy/rights dependencies, reputation/UX risk, demand signal, smallest reversible test, prerequisites, measurement and rollback. Design now for later activation without premature paywalls, dark patterns or sales clutter. Automatically dispatch safe research, instrumentation and reversible design-preparation work; route pricing, public offers, sponsor outreach, commerce/provider/account connections, spend and policy decisions to Ali as one decision-ready packet.\n\nDo not publish, create/connect accounts, spend, expose private data or claim performance without exact authority/evidence. Send Control Room a concise handoff with produced units, ready/published counts, blockers, unblocks, opportunities, revenue movement and decisions genuinely needed."
