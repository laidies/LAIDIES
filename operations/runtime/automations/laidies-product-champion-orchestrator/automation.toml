prompt = "Use $laidies-product-champion to run the permanent LAiDIES Control Room dispatcher for /Users/alisoneakin/Library/Mobile Documents/com~apple~CloudDocs/LAIDIES/Website-homepage.\n\nRead operations/CODEX-WORKING-AGREEMENT.md, operations/ACTIVE-WORK.md, operations/engine/LEDGER.md, operations/product-stewards/AUTONOMOUS-DELIVERY-RUNTIME.md, operations/runtime/WORK-RESOLUTION-LOOP.md, operations/runtime/work-resolution-loop.json, operations/work-index.json, operations/release/RELEASE-STATE.json, operations/product-stewards/registry.yaml, operations/assets/active-asset-registry.json and relevant painpoint rules.\n\nThis is an execution dispatcher, not a reporting-only audit. On every run reconcile durable work against actual tasks/artifacts/receipts; dispatch every READY_TO_DISPATCH item to its permanent owner; redispatch once when activity evidence misses its next check; after a second failed cycle stop the repeated approach, record root cause and choose a materially different repair or exact dependency escalation. Trigger the next maker/judge/integration/release/public-verification owner automatically when eligible. Keep maker and judge separate. Parallelize only non-colliding lanes, with at most three write-heavy lanes. Every unresolved item needs one owner, exact next action, evidence, next check and resolution path. BLOCKED work is never parked without an unblock owner and trigger. Route to Ali only decision-ready taste/mission/public-identity/spend/new-authority choices or human perceptual review that tools cannot perform reliably.\n\nRegenerate and validate owner-state.json and owner-app.html. Run operational-integrity, work-resolution and product-steward checks. Reject unregistered/retired/rejected assets and bypassed gates. Preserve fixed lifecycle status words and exact public-release identity. Leave a durable run receipt with dispatches, completions, failures, next triggers and owner-state hash. Continue safe authorized work; never deploy, publish, spend, create/connect external accounts or use private credentials without exact authority.\n\nOn the first Wednesday run each week, also run the Rights, Provenance & Abuse Protection cycle across Brand, Platform, Editorial and Media. Maintain exact authorship/source/licence/provenance, checksum-bound masters/derivatives, approved unobtrusive watermark/brand-signature rules, embedded/sidecar metadata and Content Credentials where supported, canonical/share metadata, copyright/permitted-use language, public/private asset boundaries, proportional download/API/feed/rate-limit/anti-scraping and AI-crawler policy, impersonation/copy monitoring, preserved evidence, reporting/DMCA/legal escalation packets and false-positive safeguards. Do not claim public content can be impossible to copy: optimize for proof, attribution, detection, friction against bulk misuse and rapid response while ordinary sharing remains easy. Verify current claims from authoritative sources. Reversible internal provenance checks may proceed; public policy, enforcement, legal claims, provider changes, paid monitoring, account actions and takedowns require exact authority.\n\nThe minimum-safe public release remains commit 1a5ae63f32dae817aee1986349e184a6e6314ee3, artifact root 3cd5f0b6be865c978b916d072fefb0c2c1294fedca608c36df8fd8d00e2c0221, Cloudflare deployment 4f52df88-f875-4b24-89cd-d7649ee1df1a and rollback target 623e2b79-7fec-47ac-8ec9-e3fe80239ba1 until an authorized successor is VERIFIED_PUBLICLY."
