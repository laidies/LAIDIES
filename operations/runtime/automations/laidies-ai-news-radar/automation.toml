prompt = "Run the proactive LAiDIES NewsStand editorial radar for the workspace at /Users/alisoneakin/Library/Mobile Documents/com~apple~CloudDocs/LAIDIES/Website-homepage. First read operations/newsstand-editorial-radar.md, operations/newsstand-earned-autonomy.md, operations/newsstand-autopublish-policy.json, operations/newsstand-radar-log.md, operations/product-stewards/newsstand/PUBLICATION-VALIDATION-AND-DISCOVERY-CONTRACT.md, operations/CODEX-WORKING-AGREEMENT.md, operations/ACTIVE-WORK.md, operations/engine/LEDGER.md, operations/agents/aidb-intelligence-desk/handoffs/NEWSSTAND-INTERACTION-CONTRACT.md, and relevant prevention rules in operations/painpoints-log.md. Before browsing outward, reconcile operations/drafts/**/candidate.json, NewsStand story evidence, the radar log and content/newsstand-stories.js. For every candidate hash without a terminal hash-bound receipt, or every materially changed candidate hash, automatically start the candidate validation chain in PUBLICATION-VALIDATION-AND-DISCOVERY-CONTRACT.md: exact edition/template editor; independent AI Research & Accuracy claim/source review; relevant security/privacy/health/legal/safety specialist; Learning System and Concepts routing; independent Brand/editorial/accessibility judgment on the actual render; NewsStand champion reconciliation; and release-owner packaging. Dispatch only required independent owners, keep maker and judge separate, and stop downstream stages on a terminal REJECT or HOLD. Do not merely write 'review required': a trigger is satisfied only by a named live task/output or a durable terminal receipt with exact next trigger. Do not ask Ali to start, continue or route routine reviews. Browse current AI news using complete primary sources first, affected-party disclosures and strong independent reporting. Build LAiDIES' own evidence-based read before consulting the complete AI Daily Brief analysis when AIDB covered the topic. Then check operations/agents/aidb-intelligence-desk/handoffs/newsstand/ for new or materially updated inbound signals. Treat every AIDB handoff as intake, not a score, edition decision or publication instruction; reopen all load-bearing current sources before reuse. Merge it into the existing story identity when applicable and record exactly one disposition—CONSUMED, MERGED, WATCH, PASS, STALE or SOURCE CONFLICT—in aidb-comparison.md or the radar log. NewsStand owns what changed and why it matters now; the AIDB learning route may separately own how to work differently. Share evidence IDs and do not duplicate treatments. Score every plausible material story on the radar's six 0–3 dimensions and classify it exactly as the radar spec requires. THE BREAKING is the reader-facing live lane; the twice-daily schedule is only the monitoring cadence. THE BREAKING has no quota: CLEAR — NOTHING WORTH PUBLISHING is a successful result. Do not promote filler because it is available, current, sourced or easy to explain. Treat new model and feature releases as core THE BREAKING candidates when they materially change capability, access, price, speed, limits, privacy, safety, workflow or the sensible division of tasks between products. For each release, identify company/product/model family/public model label/version/feature; current plans/platforms/regions/API access; change from the relevant predecessor; pricing/limits/default/fallback changes; reader tasks affected; who should switch, test, wait or ignore it; vendor versus independent evidence; and real-use tests still needed. Tag model-release or feature-release and require releaseDetailsComplete=true. A new version number, launch adjectives or benchmark table alone is filler. Treat sensational, viral or misleading claims as possible Headline Reality Check assignments when correcting them teaches an important mental model. For each, paraphrase the circulating claim sparingly; classify it as SUPPORTED, TRUE BUT INCOMPLETE, MISLEADING, DISPUTED or UNSUPPORTED; identify the exact wording, omitted condition or causal leap; state what evidence does and does not establish; and lead with the consequential real takeaway. Virality earns no score. Flag candidate riskSignals with sensational_or_misleading_claim and require sensationalFramingNeutralized=true; hold when repetition could cause material harm. Update operations/newsstand-radar-log.md without duplicating existing stories. For WATCH/PASS items, record the state and do not manufacture a story. For P1 qualified items, create a private candidate packet under operations/drafts/news-radar/YYYY-MM-DD-[slug]/ with triage, source hierarchy/claim map, AIDB comparison if applicable, impacts/how-to-think analysis, recommended THE BREAKING/THE DAILY/THE WEEKLY/THE TRIBUNE/combination treatment, integrity gates, and candidate.json conforming to operations/newsstand-candidate.schema.json. Use each edition's canonical template and operations/CONTENT-PUBLISHING-STANDARD.md. Create breaking-news-draft.md when THE BREAKING is warranted. Every THE BREAKING item must include sufficient prior context, what happened and what the evidence establishes, a plain-language explanation of the mechanism, why it matters and who it affects, what changes or does not yet change for the reader, remaining uncertainty and watch points. A sourced headline roundup, feature list, raw feed, press-release paraphrase or polished explanation of a low-value development fails. Run node scripts/evaluate-newsstand-autopublish.mjs against candidate.json and record REJECT or HOLD_FOR_INDEPENDENT_REVIEW in triage.md and operations/newsstand-radar-log.md. Candidate assertions are never independent evidence. For P0 items, draft the warranted THE BREAKING, THE DAILY, THE WEEKLY and/or THE TRIBUNE piece, keeping their jobs distinct, then run the automatic validation chain. The evaluator is review-routing only and never publication authority. Never edit content/newsstand-stories.js, deploy, publish, message external people or claim public status. Alert Ali only when a fully reviewed story newly qualifies and needs her actual editorial/publication decision, materially changes, is rejected unexpectedly, or has a genuine irreducible issue; otherwise return a concise radar-clear status. Use fixed project status words and complete the learning scan for material packets."
