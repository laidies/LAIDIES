<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MAiKEOVER Card surface comparison</title>
  <style>
    body { margin:0; padding:28px; color:#11183b; background:#fff8f1; font:700 16px/1.4 system-ui,sans-serif; }

    figcaption { margin:0 0 10px; }
    img { display:block; width:100%; height:auto; border:3px solid #11183b; }

<body>
  <main>
    <figure>
      <figcaption>Rejected source · ruled, pale, white header, oversized Ai</figcaption>
      <img src="source-card-rejected.png" alt="Rejected Resident Card screenshot">
    </figure>
    <figure>
      <figcaption>Corrected implementation · line-free, saturated, ink header, even Ai</figcaption>
      <img src="implementation-card-desktop.png" alt="Corrected Resident Card implementation">
    </figure>
  </main>
</body>
</html>
