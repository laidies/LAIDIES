<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chick Flicks format comparison</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; color: #fffdfb; background: #070f2b; font: 700 14px/1.3 system-ui, sans-serif; }
    h1 { margin: 0 0 20px; color: #f254a9; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    figure { margin: 0; padding: 12px; border: 2px solid #15bce0; background: #11183b; }
    figcaption { margin-bottom: 10px; }
    img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <h1>Same viewport comparison · 1440 × 1000</h1>
  <main>
    <figure><figcaption>Listen · before</figcaption><img src="listen-before-desktop.png" alt=""></figure>
    <figure><figcaption>Listen · after</figcaption><img src="listen-after-desktop.png" alt=""></figure>
    <figure><figcaption>Read · before</figcaption><img src="read-before-desktop.png" alt=""></figure>
    <figure><figcaption>Read · after</figcaption><img src="read-after-desktop.png" alt=""></figure>
  </main>
</body>
</html>
