<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Episode 04 Watch poster comparison</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f1e7; color: #11183b; font: 700 16px/1.3 Arial, sans-serif; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 24px; }
    figure { margin: 0; }
    figcaption { margin-bottom: 8px; }
    img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border: 5px solid #11183b; }
  </style>
</head>
<body>
  <main>
    <figure>
      <figcaption>Before — generic Opening Day card</figcaption>
      <img src="/assets/media/opening-day-covers-v1/04/04-site.jpg" alt="Generic Episode 04 title card">
    </figure>
    <figure>
      <figcaption>After — widescreen artwork used to make the approved VHS</figcaption>
      <img src="/assets/episodes/ep-04/pixel/ep04-title-card-comic-v3-laidies-colour.png" alt="The Founding Mothers widescreen cover">
    </figure>
  </main>
</body>
</html>
