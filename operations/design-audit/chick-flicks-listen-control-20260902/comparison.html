<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chick Flicks Listen correction comparison</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; color: #fffdfb; background: #070f2b; font: 700 14px/1.4 system-ui, sans-serif; }
    h1 { margin: 0 0 24px; font-size: 24px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 30px; }
    figure { margin: 0; padding: 14px; border: 2px solid #15bce0; background: #11183b; }
    figcaption { margin-bottom: 10px; color: #ffd34d; }
    img { display: block; width: 100%; height: auto; background: #fffdfb; }
  </style>
</head>
<body>
  <h1>Rejected state and corrected implementation</h1>
  <div class="row">
    <figure><figcaption>Rejected: black void, unreadable failure, competing resume</figcaption><img src="rejected-player-failure.png" alt="Rejected player failure screenshot"></figure>
    <figure><figcaption>Corrected: approved VHS remains the player identity</figcaption><img src="corrected-player-2156x1114.png" alt="Corrected listen player screenshot"></figure>
  </div>
  <div class="row">
    <figure><figcaption>Rejected: pale text disappears on pale background</figcaption><img src="rejected-footer-contrast.png" alt="Rejected footer contrast screenshot"></figure>
    <figure><figcaption>Corrected: direct episode links plus dark-on-cream footer</figcaption><img src="corrected-footer-2152x784.png" alt="Corrected links and footer screenshot"></figure>
  </div>
</body>
</html>
