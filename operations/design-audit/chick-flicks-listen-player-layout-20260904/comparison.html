<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Episode 04 Listen player correction</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f1e7; color: #11183b; font: 700 15px/1.3 Arial, sans-serif; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding: 18px; }
    figure { margin: 0; }
    figcaption { min-height: 2.6rem; margin-bottom: 7px; }
    img { display: block; width: 100%; aspect-ratio: 1074 / 806; object-fit: cover; object-position: top; border: 4px solid #11183b; }
  </style>
</head>
<body>
  <main>
    <figure>
      <figcaption>Before — portrait case, collapsed Play audio and edge-hugging caption</figcaption>
      <img src="before.png" alt="Rejected Listen player">
    </figure>
    <figure>
      <figcaption>After — widescreen art, readable Play audio and padded caption</figcaption>
      <img src="after-desktop.png" alt="Corrected Listen player">
    </figure>
  </main>
</body>
</html>
