<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Wrong turn in SUNNYVAiLE · LAiDIES</title>
  <style>
    :root {
      color-scheme: light;
      --plum: #4b2148;
      --rose: #a9476a;
      --cream: #fffaf6;
      --paper: #fff;
      --gold: #c9a227;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      color: var(--plum);
      background:
        radial-gradient(circle at 15% 15%, rgba(201, 162, 39, .16), transparent 26rem),
        linear-gradient(145deg, #f8e9ef, var(--cream));
      font: 17px/1.55 "Jost", "Avenir Next", Arial, sans-serif;
    }
    main {
      width: min(650px, 100%);
      padding: clamp(34px, 7vw, 70px);
      text-align: center;
      background: var(--paper);
      border: 1px solid rgba(75, 33, 72, .16);
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(75, 33, 72, .14);
    }
    .kicker {
      margin: 0 0 12px;
      color: var(--rose);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font: 700 clamp(42px, 9vw, 76px)/.95 Georgia, serif;
      letter-spacing: -.045em;
    }
    p { max-width: 500px; margin: 24px auto; }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    a {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border: 2px solid var(--plum);
      border-radius: 999px;
      color: var(--plum);
      font-weight: 750;
      text-decoration: none;
    }
    a:first-child { color: var(--cream); background: var(--plum); }
    a:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Wrong turn · 404</p>
    <h1>As if.</h1>
    <p>That address is not on the SUNNYVAiLE map. The Welcome Wagon can point you toward the good stuff.</p>
    <nav aria-label="Recovery links">
      <a href="/visitors-centre.html">Visit the Welcome Wagon</a>
      <a href="/">Return to LAiDIES</a>
    </nav>
  </main>
</body>
</html>
