<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVC-01 visual QA comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; background: #17111b; color: #fff8df; font: 700 14px/1.4 Arial, sans-serif; }
      h1 { margin: 0 0 24px; font: 900 28px/1 Arial, sans-serif; }
      section { margin: 0 0 32px; padding: 16px; border: 2px solid #fff8df; }
      h2 { margin: 0 0 12px; font: 900 20px/1 Arial, sans-serif; }
      .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      figure { margin: 0; min-width: 0; }
      figcaption { margin-bottom: 8px; color: #f4cd57; letter-spacing: .08em; text-transform: uppercase; }
      img { display: block; width: 100%; height: 420px; object-fit: cover; object-position: center top; background: #2a172d; }
    </style>
  </head>
  <body>
    <h1>SVC-01 — source art beside implemented system</h1>
    <section>
      <h2>A — one graphic-novel world</h2>
      <div class="pair">
        <figure><figcaption>Source visual target</figcaption><img src="/assets/library-room-comic-desktop.png" alt="" /></figure>
        <figure><figcaption>Implemented system</figcaption><img src="/qa/A-arrival.png" alt="" /></figure>
      </div>
    </section>
    <section>
      <h2>B — deliberate dual system</h2>
      <div class="pair">
        <figure><figcaption>Source visual target</figcaption><img src="/assets/library-room-painterly-desktop.png" alt="" /></figure>
        <figure><figcaption>Implemented system</figcaption><img src="/qa/B-arrival.png" alt="" /></figure>
      </div>
    </section>
    <section>
      <h2>C — functional hybrid</h2>
      <div class="pair">
        <figure><figcaption>Passive painterly source</figcaption><img src="/assets/library-room-painterly-desktop.png" alt="" /></figure>
        <figure><figcaption>Implemented system with hard-ink operated objects</figcaption><img src="/qa/C-arrival.png" alt="" /></figure>
      </div>
    </section>
  </body>
</html>
