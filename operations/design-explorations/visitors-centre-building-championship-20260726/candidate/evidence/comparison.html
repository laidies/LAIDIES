<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Visitor's Centre incumbent / candidate visual comparison</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #101b36; color: #fff; font: 700 15px/1.4 Avenir, sans-serif; }
    h1 { margin: 0 0 18px; font-size: 24px; }
    h2 { margin: 0 0 8px; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; margin-bottom: 30px; }
    figure { margin: 0; min-width: 0; }
    img { display: block; width: 100%; border: 2px solid #fff; background: #fff; }
    .mobile img { width: 390px; max-width: 100%; margin: 0 auto; }
    figcaption { margin-top: 8px; color: #acdeda; }
  </style>
</head>
<body>
  <h1>Same-state visible comparison · clean newcomer arrival</h1>
  <div class="row">
    <figure>
      <h2>Incumbent · desktop 1440</h2>
      <img src="../../evidence/incumbent/desktop-1440-newcomer-full.png" alt="Full-page desktop capture of the incumbent Visitor's Centre">
      <figcaption>Current source · 3,502px document height.</figcaption>
    </figure>
    <figure>
      <h2>Fold-Out Map Counter candidate · desktop 1440</h2>
      <img src="desktop-1440-newcomer-full.png" alt="Full-page desktop capture of the isolated candidate">
      <figcaption>Isolated owner-review candidate · room and desk remain one authored composition.</figcaption>
    </figure>
  </div>
  <div class="row mobile">
    <figure>
      <h2>Incumbent · mobile 390</h2>
      <img src="../../evidence/incumbent/mobile-390-newcomer-full.png" alt="Full-page mobile capture of the incumbent Visitor's Centre">
    </figure>
    <figure>
      <h2>Fold-Out Map Counter candidate · mobile 390</h2>
      <img src="mobile-390-newcomer-full.png" alt="Full-page mobile capture of the isolated candidate">
    </figure>
  </div>
</body>
</html>
