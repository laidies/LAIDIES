<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LIBRAiRY 101 Family Proof</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, sans-serif;
      background: #071225;
      color: #fffaf2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 36px;
      background:
        radial-gradient(circle at 15% 0%, rgba(26, 211, 229, .16), transparent 32%),
        radial-gradient(circle at 85% 0%, rgba(238, 63, 153, .16), transparent 34%),
        #071225;
    }
    header {
      max-width: 1540px;
      margin: 0 auto 28px;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: #70e9f4;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 4.5rem);
      line-height: .95;
    }
    .note {
      margin: 14px 0 0;
      max-width: 920px;
      color: #dce5ff;
      font-size: 1.05rem;
      line-height: 1.45;
    }
    .shelf {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      align-items: end;
      gap: 16px;
      max-width: 1540px;
      margin: auto;
      padding: 28px 20px 12px;
      border-bottom: 22px solid #f4d9a6;
      border-radius: 22px 22px 4px 4px;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.015));
      box-shadow: 0 28px 60px rgba(0,0,0,.38);
    }
    figure {
      margin: 0;
      min-width: 0;
      text-align: center;
    }
    img {
      display: block;
      width: 100%;
      height: 600px;
      object-fit: contain;
      object-position: center bottom;
      filter: drop-shadow(0 18px 16px rgba(0,0,0,.34));
    }
    figcaption {
      margin-top: 10px;
      color: #fffaf2;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    @media (max-width: 900px) {
      body { padding: 20px; }
      .shelf { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      img { height: 420px; }
    }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">Owner review · 101-series family</p>
    <h1>One header system. Five distinct books.</h1>
    <p class="note">
      Locked family marker: cyan wedge, hot-pink upper field, cobalt band and
      violet edge. Main body colours distinguish the titles.
    </p>
  </header>
  <main class="shelf" aria-label="Five LIBRAiRY 101 textbook cover candidates">
    <figure>
      <img src="production-candidates/textbook-vocab-101-v2.png" alt="Vocab 101 cover">
      <figcaption>Vocab</figcaption>
    </figure>
    <figure>
      <img src="production-candidates/textbook-concepts-101-v3.png" alt="Concepts 101 cover">
      <figcaption>Concepts</figcaption>
    </figure>
    <figure>
      <img src="production-candidates/textbook-briefing-101-first-v1.png" alt="Briefing 101 cover">
      <figcaption>Briefing</figcaption>
    </figure>
    <figure>
      <img src="production-candidates/textbook-setup-101-v2.png" alt="Setup 101 cover">
      <figcaption>Setup</figcaption>
    </figure>
    <figure>
      <img src="production-candidates/textbook-accounts-101-v2.png" alt="Accounts 101 cover">
      <figcaption>Accounts</figcaption>
    </figure>
  </main>
</body>
</html>
