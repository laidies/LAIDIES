<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#eef1f4"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#34414d">
    <text x="65" y="42" font-size="28" font-weight="700">ADULT WOMAN — FIXED 7.5-HEAD PROPORTION SCAFFOLD</text>
    <text x="65" y="70">Match the mannequin silhouette and every horizontal landmark. Clothing must not alter the anatomy.</text>
  </g>

  <!-- Figure scale: crown y=60, floor y=1020, one head unit=128 px -->
  <g stroke="#8795a1" stroke-width="2" stroke-dasharray="10 10" opacity="0.85">
    <line x1="70" y1="60" x2="1780" y2="60"/>
    <line x1="70" y1="188" x2="1780" y2="188"/>
    <line x1="70" y1="316" x2="1780" y2="316"/>
    <line x1="70" y1="444" x2="1780" y2="444"/>
    <line x1="70" y1="572" x2="1780" y2="572"/>
    <line x1="70" y1="700" x2="1780" y2="700"/>
    <line x1="70" y1="828" x2="1780" y2="828"/>
    <line x1="70" y1="956" x2="1780" y2="956"/>
    <line x1="70" y1="1020" x2="1780" y2="1020"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#52616d">
    <text x="90" y="54">0 — CROWN</text>
    <text x="90" y="182">1 — CHIN</text>
    <text x="90" y="310">2 — BUST</text>
    <text x="90" y="438">3 — NAVEL / ELBOW</text>
    <text x="90" y="566">4 — CROTCH / WRIST</text>
    <text x="90" y="694">5 — MID-THIGH</text>
    <text x="90" y="822">6 — JUST BELOW KNEE</text>
    <text x="90" y="950">7 — LOWER SHIN</text>
    <text x="90" y="1014">7.5 — FLOOR</text>
  </g>

  <!-- Extra fixed anatomical landmarks -->
  <g stroke-width="4" opacity="0.95">
    <line x1="650" y1="232" x2="1550" y2="232" stroke="#00a6a6"/>
    <line x1="650" y1="405" x2="1550" y2="405" stroke="#d96c00"/>
    <line x1="650" y1="508" x2="1550" y2="508" stroke="#8b55c5"/>
    <line x1="650" y1="764" x2="1550" y2="764" stroke="#d62473"/>
    <line x1="650" y1="988" x2="1550" y2="988" stroke="#286bd6"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">
    <text x="1570" y="238" fill="#007f7f">SHOULDERS 1.35</text>
    <text x="1570" y="411" fill="#a85100">WAIST 2.7</text>
    <text x="1570" y="514" fill="#7040a4">HIP CREST 3.5</text>
    <text x="1570" y="770" fill="#b51b5d">KNEE CENTRE 5.5</text>
    <text x="1570" y="994" fill="#1d55ad">ANKLE 7.25</text>
  </g>

  <!-- Measured adult mannequin, centered at x=1100 -->
  <g stroke="#18232c" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- head: exactly one unit high, moderate adult width -->
    <ellipse cx="1100" cy="124" rx="46" ry="64" fill="#f2c9ae"/>
    <!-- neck -->
    <path d="M1078 181 L1075 220 Q1100 238 1125 220 L1122 181 Z" fill="#f2c9ae"/>
    <!-- torso and pelvis: adult mass, not shrunken -->
    <path d="M975 232 Q1025 214 1075 220 Q1100 236 1125 220 Q1175 214 1225 232
             Q1202 278 1190 330 Q1178 382 1180 425
             Q1210 466 1205 520 Q1170 555 1100 566 Q1030 555 995 520
             Q990 466 1020 425 Q1022 382 1010 330 Q998 278 975 232 Z" fill="#91a8b7"/>
    <!-- left arm, relaxed: wrist at 4 heads, fingertips upper thigh -->
    <path d="M975 235 Q940 250 925 292 L902 395 L885 505 L875 568
             Q875 590 892 607 Q912 598 914 575 L920 520 L944 415 L970 320 Z" fill="#f2c9ae"/>
    <!-- right arm, hand on hip, anatomically normal -->
    <path d="M1225 235 Q1266 250 1287 290 L1328 382 Q1338 407 1317 423
             L1248 476 L1220 507 Q1204 520 1188 504 Q1180 490 1197 474
             L1228 440 L1280 397 L1240 322 Z" fill="#f2c9ae"/>
    <!-- left hand -->
    <path d="M875 556 Q858 577 866 608 L878 629 Q888 640 899 630 L904 609 L897 582 Z" fill="#f2c9ae"/>
    <!-- right hand -->
    <path d="M1189 474 Q1168 486 1161 511 Q1164 531 1183 529 L1215 506 L1227 480 Z" fill="#f2c9ae"/>
    <!-- left leg: moderate thigh/calf width -->
    <path d="M1000 520 Q1016 555 1028 572 L1035 670 Q1038 720 1028 764
             L1018 850 Q1014 918 1027 988 L1080 988
             Q1087 920 1080 850 L1074 764 Q1082 710 1088 650 L1092 566 Z" fill="#f2c9ae"/>
    <!-- right leg -->
    <path d="M1108 566 Q1112 650 1118 710 Q1126 748 1126 764
             L1120 850 Q1113 920 1120 988 L1173 988
             Q1186 918 1182 850 L1172 764 Q1162 720 1165 670 L1172 572
             Q1184 555 1200 520 Z" fill="#f2c9ae"/>
    <!-- feet -->
    <path d="M1027 988 L1080 988 L1098 1010 Q1082 1020 1020 1020 Q998 1014 1027 988 Z" fill="#26333c"/>
    <path d="M1120 988 L1173 988 Q1202 1014 1180 1020 Q1118 1020 1102 1010 Z" fill="#26333c"/>
  </g>

  <!-- Width callouts -->
  <g stroke="#26333c" stroke-width="3" fill="none">
    <line x1="975" y1="218" x2="1225" y2="218"/>
    <line x1="975" y1="210" x2="975" y2="226"/>
    <line x1="1225" y1="210" x2="1225" y2="226"/>
    <line x1="995" y1="535" x2="1205" y2="535"/>
    <line x1="995" y1="527" x2="995" y2="543"/>
    <line x1="1205" y1="527" x2="1205" y2="543"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#26333c">
    <text x="1010" y="207">SHOULDER WIDTH ≈ 2.7 HEAD WIDTHS</text>
    <text x="1027" y="558">NATURAL ADULT HIP WIDTH</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#34414d">
    <text x="65" y="1050">Validation: head 1/7.5 height • crotch 4/7.5 • knee centre 5.5/7.5 • ankle 7.25/7.5 • wrist at crotch • fingertips upper thigh</text>
  </g>
</svg>
