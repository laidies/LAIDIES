<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2180" viewBox="0 0 1400 2180" role="img" aria-labelledby="title desc">
  <title id="title">How different AI type labels fit together</title>
  <desc id="desc">Artificial intelligence is the umbrella. Six rows show that type labels answer different questions about a system: its job, information, operation, physical interaction, breadth and construction. A customer service assistant demonstrates how one product can receive several labels at once.</desc>
  <rect x="0" y="0" width="1400" height="2180" fill="#ffffff"/>
  <rect x="40" y="40" width="1320" height="2100" rx="36" fill="#ffffff" stroke="#55258b" stroke-width="8"/>
  <rect x="70" y="70" width="1260" height="190" rx="28" fill="#55258b"/>
  <text x="700" y="130" text-anchor="middle" fill="#ffd5e9" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="3">ARTIFICIAL INTELLIGENCE</text>
  <text x="700" y="188" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800">How the different AI labels fit together</text>
  <text x="700" y="230" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="25">One system can have labels from several rows.</text>

  <rect x="80" y="300" width="1240" height="175" rx="24" fill="#f5efff" stroke="#d9c9ea" stroke-width="3"/>
  <circle cx="140" cy="355" r="34" fill="#d53f8c"/>
  <text x="140" y="366" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">1</text>
  <text x="200" y="353" fill="#24163f" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800">What result does it produce?</text>
  <text x="200" y="397" fill="#635975" font-family="Arial, Helvetica, sans-serif" font-size="27">These labels describe the result.</text>
  <rect x="820" y="326" width="210" height="74" rx="18" fill="#fff0a8" stroke="#b78800" stroke-width="3"/>
  <text x="925" y="371" text-anchor="middle" fill="#24163f" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800">Predictive</text>
  <rect x="1050" y="326" width="220" height="74" rx="18" fill="#ffd5e9" stroke="#d53f8c" stroke-width="3"/>
  <text x="1160" y="371" text-anchor="middle" fill="#24163f" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800">Generative</text>

  <rect x="80" y="495" width="1240" height="175" rx="24" fill="#eef8ff" stroke="#b8dff2" stroke-width="3"/>
  <circle cx="140" cy="550" r="34" fill="#0089a8"/>
  <text x="140" y="561" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">2</text>
  <text x="200" y="548" fill="#24163f" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800">What information can it handle?</text>
  <text x="200" y="592" fill="#635975" font-family="Arial, Helvetica, sans-serif" font-size="27">Text, images, audio, video or sensor data.</text>
  <rect x="1005" y="521" width="265" height="74" rx="18" fill="#d8f4f4" stroke="#0089a8" stroke-width="3"/>
  <text x="1137" y="566" text-anchor="middle" fill="#24163f" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800">Multimodal</text>

  <rect x="80" y="690" width="1240" height="175" rx="24" fill="#fff4f8" stroke="#f0bfd6" stroke-width="3"/>
  <circle cx="140" cy="745" r="34" fill="#a32570"/>
  <text x="140" y="756" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">3</text>
  <text x="200" y="743" fill="#24163f" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800">Does it stop, or keep working?</text>
  <text x="200" y="787" fill="#635975" font-family="Arial, Helvetica, sans-serif" font-size="27">An agentic system continues through steps, tools and results.</text>
  <rect x="1040" y="716" width="230" height="74" rx="18" fill="#ffd5e9" stroke="#a32570" stroke-width="3"/>
  <text x="1155" y="761" text-anchor="middle" fill="#24163f" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800">Agentic</text>

  <rect x="80" y="885" width="1240" height="175" rx="24" fill="#f4f1ff" stroke="#cfc3ef" stroke-width="3"/>
  <circle cx="140" cy="940" r="34" fill="#7247a8"/>
  <text x="140" y="951" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">4</text>
  <text x="200" y="938" fill="#24163f" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800">Does it act in the physical world?</text>
  <text x="200" y="982" fill="#635975" font-family="Arial, Helvetica, sans-serif" font-size="27">Bodies, vehicles, machines, cameras, sensors or controls.</text>
  <rect x="1020" y="911" width="250" height="74" rx="18" fill="#e6dcff" stroke="#7247a8" stroke-width="3"/>
  <text x="1145" y="956" text-anchor="middle" fill="#24163f" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800">Embodied</text>

  <rect x="80" y="1080" width="1240" height="210" rx="24" fill="#fff9dc" stroke="#ead679" stroke-width="3"/>
  <circle cx="140" cy="1135" r="34" fill="#b78800"/>
  <text x="140" y="1146" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">5</text>
  <text x="200" y="1133" fill="#24163f" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800">How broad are its abilities?</text>
  <text x="200" y="1177" fill="#635975" font-family="Arial, Helvetica, sans-serif" font-size="27">Current breadth is not proof of a future intelligence level.</text>
  <rect x="200" y="1205" width="225" height="58" rx="16" fill="#ffffff" stroke="#b78800" stroke-width="3"/>
  <text x="312" y="1242" text-anchor="middle" fill="#24163f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Specialised</text>
  <rect x="445" y="1205" width="250" height="58" rx="16" fill="#ffffff" stroke="#b78800" stroke-width="3"/>
  <text x="570" y="1242" text-anchor="middle" fill="#24163f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">General-purpose</text>
  <rect x="715" y="1205" width="245" height="58" rx="16" fill="#ffffff" stroke="#d53f8c" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="837" y="1242" text-anchor="middle" fill="#24163f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">AGI: disputed</text>
  <rect x="980" y="1205" width="245" height="58" rx="16" fill="#ffffff" stroke="#d53f8c" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="1102" y="1242" text-anchor="middle" fill="#24163f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">ASI: hypothetical</text>

  <rect x="80" y="1310" width="1240" height="205" rx="24" fill="#eefaf5" stroke="#b9e3d0" stroke-width="3"/>
  <circle cx="140" cy="1365" r="34" fill="#17845b"/>
  <text x="140" y="1376" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">6</text>
  <text x="200" y="1363" fill="#24163f" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800">How was the capability built?</text>
  <text x="200" y="1407" fill="#635975" font-family="Arial, Helvetica, sans-serif" font-size="27">Construction labels form a separate family.</text>
  <rect x="580" y="1433" width="660" height="55" rx="16" fill="#ffffff" stroke="#17845b" stroke-width="3"/>
  <text x="910" y="1468" text-anchor="middle" fill="#24163f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Machine learning  ›  neural networks  ›  deep learning</text>
  <rect x="200" y="1433" width="250" height="55" rx="16" fill="#ffffff" stroke="#17845b" stroke-width="3"/>
  <text x="325" y="1468" text-anchor="middle" fill="#24163f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Explicit rules</text>

  <rect x="80" y="1545" width="1240" height="115" rx="24" fill="#24163f"/>
  <text x="115" y="1590" fill="#ffd5e9" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800">ONE CUSTOMER-SERVICE ASSISTANT COULD BE:</text>
  <text x="115" y="1630" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="24">predictive + generative + multimodal + agentic + software-only + specialised + built with ML and rules</text>

  <text x="700" y="1720" text-anchor="middle" fill="#55258b" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="800">Three relationships people often mix up</text>

  <rect x="80" y="1760" width="1240" height="100" rx="22" fill="#f5efff" stroke="#d9c9ea" stroke-width="3"/>
  <text x="115" y="1802" fill="#a32570" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800">TRUE NESTING</text>
  <text x="340" y="1802" fill="#24163f" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800">AI  ›  machine learning  ›  neural networks  ›  deep learning</text>
  <text x="115" y="1838" fill="#635975" font-family="Arial, Helvetica, sans-serif" font-size="25">Each term on the right is a subfamily of the term before it.</text>

  <rect x="80" y="1880" width="1240" height="100" rx="22" fill="#eef8ff" stroke="#b8dff2" stroke-width="3"/>
  <text x="115" y="1922" fill="#0089a8" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800">INTERNAL MECHANISM</text>
  <text x="390" y="1922" fill="#24163f" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800">A generative language model makes repeated predictions.</text>
  <text x="115" y="1958" fill="#635975" font-family="Arial, Helvetica, sans-serif" font-size="25">Prediction helps produce the content; the product job is still generative.</text>

  <rect x="80" y="2000" width="1240" height="100" rx="22" fill="#fff4f8" stroke="#f0bfd6" stroke-width="3"/>
  <text x="115" y="2042" fill="#a32570" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800">COMMON PRODUCT STACK</text>
  <text x="440" y="2042" fill="#24163f" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800">An agentic system may use generative and predictive models.</text>
  <text x="115" y="2078" fill="#635975" font-family="Arial, Helvetica, sans-serif" font-size="25">It can also use explicit rules, planning software and tools; this is not a universal family tree.</text>
</svg>
