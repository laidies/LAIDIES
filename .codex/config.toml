# Tracked source for the LAiDIES workspace-level Codex configuration.
# Sync/check this checkout: node scripts/sync-codex-workspace-config.mjs [--check]
# Outer workspace: set LAIDIES_CODEX_WORKSPACE_TARGET to its exact config path.

model = "gpt-6-astra"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"

sandbox_mode = "danger-full-access"

[agents]
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"

[features]
multi_agent = true
hooks = true
fast_mode = false
