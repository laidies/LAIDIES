# LAiDIES adaptive-compute baseline.
# This copy is required because Website-homepage is its own Git/project root;
# Codex project discovery may stop here instead of loading the workspace layer.

model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"

[agents]
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"

[features]
# Fast mode trades materially more credits for lower latency. Keep it off
# unless Ali explicitly says that speed matters more than usage for a task.
fast_mode = false
