      <stop offset="0" stop-color="#f8ffff"/>
      <stop offset=".72" stop-color="#a8eff4"/>
      <stop offset="1" stop-color="#62cedb"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6ab6"/>
      <stop offset=".55" stop-color="#ef4d9c"/>
