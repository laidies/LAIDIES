<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-labelledby="title desc">
  <title id="title">Colourful Library wall clock</title>
  <desc id="desc">A round 1990s-style wall clock with a pink rim, cyan face and yellow hands.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
