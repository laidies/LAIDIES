<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 168" width="180" height="168">
  <!-- doodles a kid left on the contents page: the cool S, a heart, a star, a peace sign, a bolt -->
  <!-- cool S (blue biro), top-left, slight tilt -->
  <g fill="none" stroke="#2f45a0" stroke-opacity="0.72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="translate(8,6) rotate(-7 20 29)">
    <path d="M30 13 L17 8 L11 17 L19 27 L29 37 L23 49 L10 50"/>
  </g>
  <!-- heart (red pen), top-right -->
  <g fill="none" stroke="#c0405a" stroke-opacity="0.72" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(120,10) rotate(8 17 17)">
    <path d="M17 30 C 4 19, 7 5, 17 13 C 27 5, 30 19, 17 30 Z"/>
  </g>
  <!-- star (black pen), middle -->
  <g fill="none" stroke="#33323a" stroke-opacity="0.66" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" transform="translate(78,46) rotate(-6 16 16)">
    <path d="M16 2 L19.4 11.4 L30 11.6 L21.4 18 L24.8 28.6 L16 22.4 L7.2 28.6 L10.6 18 L2 11.6 L12.6 11.4 Z"/>
