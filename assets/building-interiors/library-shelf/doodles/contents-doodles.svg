  <!-- tiny extra S, far corner (they drew it everywhere) -->
  <g fill="none" stroke="#33323a" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(86,118) scale(0.6) rotate(12 20 29)">
    <path d="M30 13 L17 8 L11 17 L19 27 L29 37 L23 49 L10 50"/>
