    <path d="M16 2 L16 30"/><path d="M16 16 L6.5 25"/><path d="M16 16 L25.5 25"/>
  </g>
  <!-- lightning bolt (blue pen), lower-right -->
  <g fill="none" stroke="#2f45a0" stroke-opacity="0.62" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" transform="translate(122,108) rotate(6 15 17)">
    <path d="M16 2 L7 20 L14 20 L10 34 L24 12 L15 12 L20 2 Z"/>
