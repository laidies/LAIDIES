name: Exact NewsStand review preview

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character candidate commit to build
        required: true
        type: string
      package_sha256:
        description: Exact SHA-256 of the held Daily review package
        required: true
        type: string
      deploy_preview:
        description: Deploy to the Access-protected Cloudflare Pages preview project
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  exact-newsstand-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARTIFACT_DIR: /tmp/laidies-newsstand-preview-site
      RECEIPT_DIR: /tmp/laidies-newsstand-preview-receipt
      PROJECT_NAME: laidies-sunnyvaile-preview
      PACKAGE_PATH: operations/product-stewards/newsstand/candidates/complete-daily-review-package-2026-08-12-v3.json
      EXPECTED_PACKAGE_SHA256: 144131404400bdabfb2283c8bdab900f9a34533edd5f19bebe36709f85156d5f
      INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
      INPUT_PACKAGE_SHA256: ${{ inputs.package_sha256 }}
      CONTROLLER_SHA: ${{ vars.NEWSSTAND_PREVIEW_CONTROLLER_SHA }}
      WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify immutable controller, source and Daily package
        shell: bash
        run: |
          set -euo pipefail
          [[ "$INPUT_COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$INPUT_PACKAGE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$CONTROLLER_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$CONTROLLER_SHA" = "$WORKFLOW_SHA"
          test "$INPUT_PACKAGE_SHA256" = "$EXPECTED_PACKAGE_SHA256"
          test "$(git rev-parse HEAD)" = "$INPUT_COMMIT_SHA"
          test "$(sha256sum "$PACKAGE_PATH" | cut -d' ' -f1)" = "$INPUT_PACKAGE_SHA256"
          test -z "$(git status --porcelain)"
      - name: Install locked dependencies
        run: npm ci
      - name: NewsStand canonical pipeline integrity
        run: npm run test:newsstand-canon
      - name: Verify complete Daily package
        run: |
          node scripts/test-newsstand-complete-daily-review.mjs
          node scripts/check-newsstand-complete-daily-review.mjs "$PACKAGE_PATH"
      - name: Calibrate private review preview
        run: node scripts/test-newsstand-review-preview.mjs
      - name: Calibrate exact preview controller
        run: node scripts/test-newsstand-exact-preview.mjs
      - name: Build exact private NewsStand preview
        shell: bash
        run: |
          set -euo pipefail
          NEWSSTAND_REVIEW_PACKAGE_PATH="$GITHUB_WORKSPACE/$PACKAGE_PATH" \
          NEWSSTAND_REVIEW_SOURCE_COMMIT="$INPUT_COMMIT_SHA" \
            node scripts/build-newsstand-review-preview.mjs "$ARTIFACT_DIR" --fixture
      - name: Verify private-review truth and artifact identity
        shell: bash
        run: |
          set -euo pipefail
          private_receipt="$ARTIFACT_DIR/newsstand-private-preview-receipt.json"
          jq -e \
            --arg commit "$INPUT_COMMIT_SHA" \
            --arg package_path "$PACKAGE_PATH" \
            --arg package_sha "$INPUT_PACKAGE_SHA256" '
              .schema == "laidies.newsstand-private-preview-artifact.v1" and
              .status == "BUILT_NOT_DEPLOYED" and
              .sourceCommit == $commit and
              .package.path == $package_path and .package.sha256 == $package_sha and
              .publicAuthority == false and .canonicalWrite == false and
              .deployAuthority == false
            ' "$private_receipt" >/dev/null
          grep -F 'PRIVATE REVIEW — NOT PUBLISHED' "$ARTIFACT_DIR/newsstand.html" >/dev/null
          grep -F 'noindex,nofollow,noarchive' "$ARTIFACT_DIR/newsstand.html" >/dev/null
          mkdir -p "$RECEIPT_DIR"
          node scripts/create-release-manifest.mjs "$ARTIFACT_DIR" "$RECEIPT_DIR/artifact-manifest.json"
      - name: Write and verify prepared exact-preview receipt
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RECEIPT_DIR/artifact-manifest.json"
          identity="$(jq -r .identitySha256 "$manifest")"
          artifact_candidate="$(jq -r '.files[] | select(.path == "newsstand.html") | .sha256' "$manifest")"
          private_receipt_sha="$(jq -r '.files[] | select(.path == "newsstand-private-preview-receipt.json") | .sha256' "$manifest")"
          jq -n \
            --arg commit "$INPUT_COMMIT_SHA" \
            --arg package_path "$PACKAGE_PATH" \
            --arg package_sha "$INPUT_PACKAGE_SHA256" \
            --arg artifact_candidate "$artifact_candidate" \
            --arg private_receipt_sha "$private_receipt_sha" \
            --arg identity "$identity" '
              {
                schema:"laidies.newsstand-exact-preview.v1",
                status:"PREPARED_NO_DEPLOY",
                source_commit:$commit,
                project:"laidies-sunnyvaile-preview",
                package:{path:$package_path,sha256:$package_sha},
                candidate:{path:"newsstand.html",artifact_sha256:$artifact_candidate},
                private_preview_receipt:{path:"newsstand-private-preview-receipt.json",sha256:$private_receipt_sha},
                artifact_manifest:{path:"artifact-manifest.json",identity_sha256:$identity},
                deployment_id:null,
                preview_url:null,
                review_url:null,
                review_branch:null,
                access_credential:null,
                public_verification:null,
                visual_capture:null,
                checks:[
                  {id:"complete-daily-package",result:"PASS"},
                  {id:"review-preview-calibration",result:"PASS"},
                  {id:"exact-private-preview-build",result:"PASS"},
                  {id:"private-preview-truth",result:"PASS"},
                  {id:"curated-public-build",result:"PASS"}
                ]
              }
            ' > "$RECEIPT_DIR/preview-receipt.json"
          node scripts/check-newsstand-exact-preview.mjs "$RECEIPT_DIR/preview-receipt.json"
      - name: Upload exact candidate and prepared receipt
        uses: actions/upload-artifact@v4
        with:
          name: exact-newsstand-preview-${{ inputs.commit_sha }}
          path: |
            ${{ env.ARTIFACT_DIR }}
            ${{ env.RECEIPT_DIR }}
          if-no-files-found: error
          retention-days: 7

  deploy-preview:
    if: ${{ inputs.deploy_preview }}
    needs: exact-newsstand-preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The existing Cloudflare Pages credential pair and the separately scoped
    # Access API token are stored in the protected production environment. The
    # target remains the separately named preview project and is checked below
    # before any Cloudflare mutation.
    environment: production
    permissions:
      contents: read
    env:
      DOWNLOAD_DIR: /tmp/exact-newsstand-preview
      ARTIFACT_DIR: /tmp/exact-newsstand-preview/laidies-newsstand-preview-site
      RECEIPT_DIR: /tmp/exact-newsstand-preview/laidies-newsstand-preview-receipt
      PROJECT_NAME: laidies-sunnyvaile-preview
      PACKAGE_PATH: operations/product-stewards/newsstand/candidates/complete-daily-review-package-2026-08-12-v3.json
      EXPECTED_PACKAGE_SHA256: 144131404400bdabfb2283c8bdab900f9a34533edd5f19bebe36709f85156d5f
      INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
      INPUT_PACKAGE_SHA256: ${{ inputs.package_sha256 }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: exact-newsstand-preview-${{ inputs.commit_sha }}
          path: ${{ env.DOWNLOAD_DIR }}
      - name: Install pinned browser runtime for exact deployed-pixel capture
        shell: bash
        run: |
          set -euo pipefail
          npm install --global playwright-core@1.62.1
          npx --yes playwright@1.62.1 install --with-deps chromium
          playwright_root="$(npm root --global)"
          chromium_path="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chromium-*' -print -quit)"
          test -f "$playwright_root/playwright-core/package.json"
          test -x "$chromium_path"
          echo "PLAYWRIGHT_CORE_PATH=$playwright_root/playwright-core" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$chromium_path" >> "$GITHUB_ENV"
      - name: Validate prepared artifact and existing Access policy
        shell: bash
        env:
          CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCESS_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$PROJECT_NAME" = "laidies-sunnyvaile-preview"
          jq -e \
            --arg commit "$INPUT_COMMIT_SHA" \
            --arg package_path "$PACKAGE_PATH" \
            --arg package_sha "$EXPECTED_PACKAGE_SHA256" '
              .schema == "laidies.newsstand-exact-preview.v1" and
              .status == "PREPARED_NO_DEPLOY" and
              .source_commit == $commit and
              .project == "laidies-sunnyvaile-preview" and
              .package.path == $package_path and .package.sha256 == $package_sha and
              .candidate.path == "newsstand.html" and
              .deployment_id == null and .preview_url == null and .review_url == null and
              .review_branch == null and .access_credential == null and
              .public_verification == null and
              ([.checks[] | select(.result == "PASS") | .id] | sort | unique) ==
                ["complete-daily-package","curated-public-build","exact-private-preview-build","private-preview-truth","review-preview-calibration"]
          ' "$RECEIPT_DIR/preview-receipt.json" >/dev/null
          test "$INPUT_PACKAGE_SHA256" = "$EXPECTED_PACKAGE_SHA256"
          access_apps="/tmp/newsstand-access-apps-${GITHUB_RUN_ID}.json"
          access_policies="/tmp/newsstand-access-policies-${GITHUB_RUN_ID}.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_ACCESS_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps" \
            > "$access_apps"
          access_app_id="$(jq -er --arg domain "*.$PROJECT_NAME.pages.dev" '
            select(.success == true) |
            [.result[] | select(.domain == $domain)] |
            if length == 1 then .[0].id else error("expected one exact preview Access application") end
          ' "$access_apps")"
          [[ "$access_app_id" =~ ^[a-f0-9-]{36}$ ]]
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_ACCESS_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps/$access_app_id/policies" \
            > "$access_policies"
          jq -e '
            .success == true and
            any(.result[];
              .decision == "non_identity" and
              any(.include[]?; has("any_valid_service_token"))
            )
          ' "$access_policies" >/dev/null
          echo "ACCESS_APP_ID=$access_app_id" >> "$GITHUB_ENV"
          rm -f "$access_apps" "$access_policies"
      - name: Create masked temporary Access verification credential
        shell: bash
        env:
          CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response="/tmp/newsstand-access-token-${GITHUB_RUN_ID}.json"
          service_token_id=""
          cleanup_on_error() {
            exit_code=$?
            trap - EXIT
            if [[ "$exit_code" -ne 0 && -n "$service_token_id" ]]; then
              curl --fail --silent --show-error --request DELETE \
                --header "Authorization: Bearer $CLOUDFLARE_ACCESS_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/service_tokens/$service_token_id" \
                >/dev/null || true
            fi
            rm -f "$response"
            exit "$exit_code"
          }
          trap cleanup_on_error EXIT
          token_name="laidies-newsstand-preview-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_ACCESS_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$(jq -nc --arg name "$token_name" '{name:$name,duration:"30m"}')" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/service_tokens" \
            > "$response"
          service_token_id="$(jq -r '.result.id // empty' "$response")"
          jq -e '
            .success == true and
            (.result.id | type == "string" and length == 36) and
            (.result.client_id | type == "string" and length > 0) and
            (.result.client_secret | type == "string" and length > 0) and
            .result.duration == "30m"
          ' "$response" >/dev/null
          client_id="$(jq -r .result.client_id "$response")"
          client_secret="$(jq -r .result.client_secret "$response")"
          echo "::add-mask::$client_id"
          echo "::add-mask::$client_secret"
          {
            echo "CF_ACCESS_SERVICE_TOKEN_ID=$service_token_id"
            echo "CF_ACCESS_CLIENT_ID=$client_id"
            echo "CF_ACCESS_CLIENT_SECRET=$client_secret"
          } >> "$GITHUB_ENV"
          rm -f "$response"
          trap - EXIT
      - name: Deploy and byte-verify exact protected preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$PROJECT_NAME" = "laidies-sunnyvaile-preview"
          [[ "$CF_ACCESS_SERVICE_TOKEN_ID" =~ ^[a-f0-9-]{36}$ ]]
          pages_auth_header="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl --fail --silent --show-error \
            --header "$pages_auth_header" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME/deployments?page=1&per_page=15" \
            > "$RECEIPT_DIR/deployments-before-response.json"
          jq -e '.success == true and (.result | type == "array")' "$RECEIPT_DIR/deployments-before-response.json" >/dev/null
          jq -e '.result' "$RECEIPT_DIR/deployments-before-response.json" > "$RECEIPT_DIR/deployments-before.json"
          review_branch="review-${INPUT_COMMIT_SHA:0:12}-${GITHUB_RUN_ID}"
          npx --yes wrangler@4.119.0 pages deploy "$ARTIFACT_DIR" \
            --project-name "$PROJECT_NAME" \
            --branch "$review_branch" \
            --commit-hash "$INPUT_COMMIT_SHA" \
            --commit-dirty=false
          deployment_visible=false
          for attempt in $(seq 1 10); do
            curl --fail --silent --show-error \
              --header "$pages_auth_header" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME/deployments?page=1&per_page=15" \
              > "$RECEIPT_DIR/deployments-after-response.json"
            jq -e '.success == true and (.result | type == "array")' "$RECEIPT_DIR/deployments-after-response.json" >/dev/null
            jq -e '.result' "$RECEIPT_DIR/deployments-after-response.json" > "$RECEIPT_DIR/deployments-after.json"
            if node - "$RECEIPT_DIR" "$INPUT_COMMIT_SHA" "$review_branch" "$CF_ACCESS_SERVICE_TOKEN_ID" <<'NODE'
          const fs=require('fs'),path=require('path');
          const [dir,commit,branch,serviceTokenId]=process.argv.slice(2);
          const before=JSON.parse(fs.readFileSync(path.join(dir,'deployments-before.json'),'utf8'));
          const after=JSON.parse(fs.readFileSync(path.join(dir,'deployments-after.json'),'utf8'));
          const prior=new Set(before.map(item=>item.id));
          const commitOf=item=>item?.source?.config?.commit_hash||item?.deployment_trigger?.metadata?.commit_hash;
          const branchOf=item=>item?.source?.config?.branch||item?.deployment_trigger?.metadata?.branch;
          const matches=after.filter(item=>!prior.has(item.id)&&branchOf(item)===branch);
          const conflicting=matches.filter(item=>commitOf(item)&&commitOf(item)!==commit);
          if(conflicting.length) throw new Error(`new preview deployment exposed conflicting provider commit metadata: ${conflicting.map(item=>commitOf(item)).join(',')}`);
          if(matches.length===0) process.exit(2);
          if(matches.length!==1||!matches[0]?.id||!matches[0]?.url) throw new Error(`expected one newly created exact preview deployment, found ${matches.length}`);
          const deployment=matches[0];
          const providerCommit=commitOf(deployment)||null;
          const receiptPath=path.join(dir,'preview-receipt.json');
          const receipt=JSON.parse(fs.readFileSync(receiptPath,'utf8'));
          receipt.status='DEPLOYED_PREVIEW';
          receipt.deployment_id=deployment.id;
          receipt.preview_url=deployment.url.endsWith('/')?deployment.url:`${deployment.url}/`;
          receipt.review_url=`${receipt.preview_url}newsstand?daily=2026-08-12`;
          receipt.review_branch=branch;
          receipt.deployment_provider_commit=providerCommit;
          receipt.deployment_provider_commit_verified=providerCommit===commit;
          receipt.deployment_identity_basis=providerCommit?'new-id+branch+provider-commit':'new-id+branch+exact-byte-verification';
          receipt.access_credential={type:'TEMPORARY_SERVICE_TOKEN',service_token_id:serviceTokenId,duration:'30m',policy_selector:'any_valid_service_token',revoked:false};
          fs.writeFileSync(receiptPath,JSON.stringify(receipt,null,2)+'\n');
          NODE
            then
              deployment_visible=true
              break
            else
              resolver_status=$?
              if [[ "$resolver_status" -ne 2 || "$attempt" -eq 10 ]]; then
                echo "Exact preview deployment did not become uniquely visible after $attempt attempt(s)." >&2
                exit "$resolver_status"
              fi
              sleep 3
            fi
          done
          test "$deployment_visible" = true
          preview_url="$(jq -r .preview_url "$RECEIPT_DIR/preview-receipt.json")"
          review_url="$(jq -r .review_url "$RECEIPT_DIR/preview-receipt.json")"
          deployment_id="$(jq -r .deployment_id "$RECEIPT_DIR/preview-receipt.json")"
          [[ "$preview_url" == "https://${deployment_id:0:8}.$PROJECT_NAME.pages.dev/" ]]
          [[ "$review_url" == "${preview_url}newsstand?daily=2026-08-12" ]]
          unauthenticated_status="$(curl --silent --show-error --output /dev/null --max-redirs 0 --write-out '%{http_code}' "$review_url")"
          [[ "$unauthenticated_status" == 302 || "$unauthenticated_status" == 401 || "$unauthenticated_status" == 403 ]]
          critical_paths=(
            newsstand.html
            content/newsstand-stories.js
            content/newsstand-daily-issues.json
            content/daily-edition-columns.json
          )
          verification_json='[]'
          for route in "${critical_paths[@]}"; do
            output="$RECEIPT_DIR/deployed-${route//\//_}"
            request_route="${route%.html}"
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              "${preview_url}${request_route}" > "$output"
            deployed_sha="$(sha256sum "$output" | cut -d' ' -f1)"
            expected_sha="$(jq -r --arg route "$route" '.files[] | select(.path == $route) | .sha256' "$RECEIPT_DIR/artifact-manifest.json")"
            test -n "$expected_sha"
            test "$deployed_sha" = "$expected_sha"
            verification_json="$(jq -c --arg path "$route" --arg sha "$deployed_sha" '. + [{path:$path,http_status:200,sha256:$sha}]' <<<"$verification_json")"
          done
          jq \
            --argjson unauthenticated "$unauthenticated_status" \
            --argjson critical_paths "$verification_json" '
              .public_verification={
                access_protected:true,
                unauthenticated_status:$unauthenticated,
                result:"PASS",
                critical_paths:$critical_paths
              }
            ' "$RECEIPT_DIR/preview-receipt.json" > "$RECEIPT_DIR/preview-receipt.updated.json"
          mv "$RECEIPT_DIR/preview-receipt.updated.json" "$RECEIPT_DIR/preview-receipt.json"
      - name: Capture exact deployed Daily pixels before credential revocation
        shell: bash
        run: |
          set -euo pipefail
          capture_dir="$RECEIPT_DIR/visual"
          mkdir -p "$capture_dir"
          node --input-type=module - <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          import { createRequire } from "node:module";

          const require = createRequire(import.meta.url);
          const { chromium } = require(process.env.PLAYWRIGHT_CORE_PATH);
          const receiptPath = path.join(process.env.RECEIPT_DIR, "preview-receipt.json");
          const receipt = JSON.parse(fs.readFileSync(receiptPath, "utf8"));
          const reviewUrl = receipt.review_url;
          const expectedDate = "2026-08-12";
          const expectedHeadline = "People published records of their AI work. Some contained passwords.";
          const viewports = [
            { id: "desktop-1440", width: 1440, height: 1024 },
            { id: "mobile-390", width: 390, height: 844 },
            { id: "mobile-320", width: 320, height: 844 }
          ];
          const browser = await chromium.launch({ executablePath: process.env.CHROME_PATH, headless: true, args: ["--no-sandbox"] });
          const captures = [];
          const states = [];
          const sha256 = buffer => crypto.createHash("sha256").update(buffer).digest("hex");
          const pngDimensions = buffer => ({ width: buffer.readUInt32BE(16), height: buffer.readUInt32BE(20) });
          const capture = async (page, relativePath, locator, meta) => {
            const absolutePath = path.join(process.env.RECEIPT_DIR, relativePath);
            const buffer = locator ? await locator.screenshot({ path: absolutePath }) : await page.screenshot({ path: absolutePath, fullPage: true });
            const dimensions = pngDimensions(buffer);
            captures.push({ path: relativePath, sha256: sha256(buffer), output: dimensions, ...meta });
          };

          try {
            for (const viewport of viewports) {
              const context = await browser.newContext({
                viewport: { width: viewport.width, height: viewport.height },
                deviceScaleFactor: 1,
                reducedMotion: "reduce",
                extraHTTPHeaders: {
                  "CF-Access-Client-Id": process.env.CF_ACCESS_CLIENT_ID,
                  "CF-Access-Client-Secret": process.env.CF_ACCESS_CLIENT_SECRET
                }
              });
              const page = await context.newPage();
              const response = await page.goto(reviewUrl, { waitUntil: "domcontentloaded", timeout: 60000 });
              if (!response || !response.ok()) throw new Error(`${viewport.id}: exact Daily returned ${response?.status() ?? "no response"}`);
              const issue = page.locator(`.ns-daily-issue[data-daily-date="${expectedDate}"]`);
              await issue.waitFor({ state: "visible", timeout: 30000 });
              await page.waitForFunction(
                headline => document.querySelector(".ns-daily-news h3")?.textContent?.trim() === headline,
                expectedHeadline,
                { timeout: 30000 }
              );
              await page.waitForTimeout(1000);
              const dailyState = await page.evaluate(() => ({
                date: document.querySelector(".ns-daily-issue")?.dataset.dailyDate || null,
                headline: document.querySelector(".ns-daily-news h3")?.textContent?.trim() || null,
                readyDesks: document.querySelectorAll('.ns-daily-desk[data-desk-state="ready"]').length,
                horizontalOverflow: document.documentElement.scrollWidth > document.documentElement.clientWidth
              }));
              if (dailyState.date !== expectedDate || dailyState.headline !== expectedHeadline || dailyState.readyDesks !== 4 || dailyState.horizontalOverflow) {
                throw new Error(`${viewport.id}: exact Daily state mismatch ${JSON.stringify(dailyState)}`);
              }
              await capture(page, `visual/${viewport.id}-daily-full-page.png`, null, { viewport, state: "DAILY_FULL_PAGE" });
              await capture(page, `visual/${viewport.id}-daily-newspaper.png`, issue, { viewport, state: "DAILY_NEWSPAPER" });
              await page.locator(".ns-daily-news a").click();
              await page.waitForFunction(() => document.querySelectorAll(".ns-article__section--longform").length === 6, null, { timeout: 30000 });
              await page.waitForTimeout(500);
              const article = page.locator(".ns-article");
              await article.waitFor({ state: "visible", timeout: 30000 });
              const articleState = await page.evaluate(() => ({
                sections: document.querySelectorAll(".ns-article__section--longform").length,
                headline: document.querySelector(".ns-article h2")?.textContent?.trim() || null,
                horizontalOverflow: document.documentElement.scrollWidth > document.documentElement.clientWidth
              }));
              if (articleState.sections !== 6 || articleState.horizontalOverflow) throw new Error(`${viewport.id}: exact article state mismatch ${JSON.stringify(articleState)}`);
              await capture(page, `visual/${viewport.id}-article.png`, article, { viewport, state: "ARTICLE" });
              states.push({ viewport, daily: dailyState, article: articleState });
              await context.close();
            }
          } finally {
            await browser.close();
          }

          receipt.visual_capture = {
            status: "CAPTURED_NOT_REVIEWED",
            review_url: reviewUrl,
            captured_at: new Date().toISOString(),
            states,
            captures
          };
          fs.writeFileSync(receiptPath, `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
          jq -e '
            .visual_capture.status == "CAPTURED_NOT_REVIEWED" and
            .visual_capture.review_url == .review_url and
            (.visual_capture.states | length) == 3 and
            ([.visual_capture.states[].daily.date] | unique) == ["2026-08-12"] and
            ([.visual_capture.states[].daily.readyDesks] | unique) == [4] and
            ([.visual_capture.states[].daily.horizontalOverflow] | unique) == [false] and
            ([.visual_capture.states[].article.sections] | unique) == [6] and
            ([.visual_capture.states[].article.horizontalOverflow] | unique) == [false] and
            (.visual_capture.captures | length) == 9 and
            ([.visual_capture.captures[].state] | sort) == ["ARTICLE","ARTICLE","ARTICLE","DAILY_FULL_PAGE","DAILY_FULL_PAGE","DAILY_FULL_PAGE","DAILY_NEWSPAPER","DAILY_NEWSPAPER","DAILY_NEWSPAPER"] and
            all(.visual_capture.captures[]; (.sha256 | test("^[a-f0-9]{64}$")) and .output.width > 0 and .output.height > 0)
          ' "$RECEIPT_DIR/preview-receipt.json" >/dev/null
      - name: Revoke temporary Access verification credential
        if: ${{ always() }}
        shell: bash
        env:
          CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CF_ACCESS_SERVICE_TOKEN_ID:-}" ]]; then
            exit 0
          fi
          revoke_response="/tmp/newsstand-access-token-revoke-${GITHUB_RUN_ID}.json"
          curl --fail --silent --show-error --request DELETE \
            --header "Authorization: Bearer $CLOUDFLARE_ACCESS_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/service_tokens/$CF_ACCESS_SERVICE_TOKEN_ID" \
            > "$revoke_response"
          jq -e '.success == true' "$revoke_response" >/dev/null
          rm -f "$revoke_response"
          if jq -e '.status == "DEPLOYED_PREVIEW" and .access_credential.service_token_id != null' "$RECEIPT_DIR/preview-receipt.json" >/dev/null 2>&1; then
            jq '.access_credential.revoked = true' \
              "$RECEIPT_DIR/preview-receipt.json" > "$RECEIPT_DIR/preview-receipt.revoked.json"
            mv "$RECEIPT_DIR/preview-receipt.revoked.json" "$RECEIPT_DIR/preview-receipt.json"
          fi
      - name: Verify deployed receipt after credential revocation
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .schema == "laidies.newsstand-exact-preview.v1" and
            .status == "DEPLOYED_PREVIEW" and
            .project == "laidies-sunnyvaile-preview" and
            (.review_url | endswith("/newsstand?daily=2026-08-12")) and
            .access_credential.type == "TEMPORARY_SERVICE_TOKEN" and
            .access_credential.duration == "30m" and
            .access_credential.policy_selector == "any_valid_service_token" and
            .access_credential.revoked == true and
            .public_verification.access_protected == true and
            .public_verification.result == "PASS" and
            .visual_capture.status == "CAPTURED_NOT_REVIEWED" and
            .visual_capture.review_url == .review_url and
            (.visual_capture.captures | length) == 9 and
            ([.public_verification.critical_paths[].path] | sort) ==
              ["content/daily-edition-columns.json","content/newsstand-daily-issues.json","content/newsstand-stories.js","newsstand.html"]
          ' "$RECEIPT_DIR/preview-receipt.json" >/dev/null
      - name: Upload deployed preview receipt
        uses: actions/upload-artifact@v4
        with:
          name: exact-newsstand-preview-deployed-${{ inputs.commit_sha }}
          path: ${{ env.RECEIPT_DIR }}
          if-no-files-found: error
          retention-days: 7
