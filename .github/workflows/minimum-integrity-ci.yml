name: Minimum integrity CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Episode gate
        run: npm run gate:episode
      - name: Episode cue scope calibration
        run: npm run test:episode-cue-scope
      - name: Codex hook guards
        run: npm run test:codex-hooks
      - name: Agent role dependency routing
        run: npm run test:agent-role-routing
      - name: Daily private pipeline
        run: npm run test:daily-private-pipeline
      - name: Learned media defect fixtures
        run: npm run test:media-defects
      - name: NewsStand canon migration
        run: npm run test:newsstand-canon
      - name: Queue claim expiry and collision guards
        run: npm run test:queue-claims
      - name: Output path CLI regression guard
        run: npm run test:output-path-cli-guards
      - name: Rejection prevention closure
        run: npm run test:rejection-prevention
      - name: Work-resolution loop
        run: npm run test:work-resolution-loop
      - name: Operational dependency — canonical instructions
        run: node scripts/check-canonical-instruction-dependencies.mjs
      - name: Operational dependency — dispatcher migration
        run: node scripts/check-dispatcher-migration.mjs
      - name: Operational dependency — media defects
        run: node scripts/check-media-defect-fixtures.mjs
      - name: Operational integrity
        run: npm run test:operational-integrity
