name: NewsStand private cloud source intake

on:
  schedule:
    - cron: "30 16,23 * * *"
  workflow_dispatch:
    inputs:
      semantic_candidate:
        description: "Run the bound private semantic planning input only"
        required: false
        type: boolean
        default: false
      backfill_since:
        description: "Optional bounded AIDB/Mollick recovery start (YYYY-MM-DD, maximum 21 days)"
        required: false
        type: string

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: newsstand-cloud-intake
  cancel-in-progress: false

jobs:
  private-intake:
    if: inputs.semantic_candidate != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore private deduplication state
        uses: actions/cache/restore@v4
        with:
          path: .newsstand-cloud-intake/state.json
          key: newsstand-cloud-intake-${{ github.run_id }}
          restore-keys: |
            newsstand-cloud-intake-

      - name: Prove intake guards can reject unsafe states
        run: |
          node scripts/test-source-registry.mjs
          node scripts/test-newsstand-cloud-intake.mjs
          node scripts/test-newsstand-cloud-intake-dispositions.mjs
          node scripts/check-newsstand-cloud-intake-dispositions.mjs
          node scripts/test-newsstand-cloud-intake-workflow.mjs

      - name: Run private source intake
        env:
          BACKFILL_SINCE: ${{ inputs.backfill_since }}
        run: |
          previous=()
          if [[ -f .newsstand-cloud-intake/state.json ]]; then
            previous=(--previous .newsstand-cloud-intake/state.json)
          fi
          backfill=()
          if [[ -n "$BACKFILL_SINCE" ]]; then
            backfill=(--backfill-since "$BACKFILL_SINCE")
          fi
          node scripts/run-newsstand-cloud-intake.mjs \
            "${previous[@]}" \
            "${backfill[@]}" \
            --output .newsstand-cloud-intake/receipt.json \
            --state-output .newsstand-cloud-intake/state.json

      - name: Upload private intake receipt
        uses: actions/upload-artifact@v4
        with:
          name: newsstand-private-intake-${{ github.run_id }}
          path: .newsstand-cloud-intake/receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Update durable reconciliation queue when attention is required
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/upsert-newsstand-intake-issue.mjs .newsstand-cloud-intake/receipt.json

      - name: Save private deduplication state
        uses: actions/cache/save@v4
        with:
          path: .newsstand-cloud-intake/state.json
          key: newsstand-cloud-intake-${{ github.run_id }}

  private-semantic:
    if: github.event_name == 'workflow_dispatch' && inputs.semantic_candidate == true && github.repository == 'laidies/LAIDIES' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Calibrate semantic and custody boundaries
        run: |
          set -euo pipefail
          node scripts/test-custody-codex-auth.mjs
          node scripts/test-select-newsstand-custody-artifacts.mjs
          node scripts/test-restore-newsstand-cloud-custody.mjs
          node scripts/test-newsstand-hosted-semantic-input.mjs
          node scripts/test-prepare-newsstand-hosted-semantic-plan.mjs
      - name: Restore encrypted dedicated session
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          NEWSSTAND_PRIVATE_HANDOFF_KEY_B64: ${{ secrets.NEWSSTAND_PRIVATE_HANDOFF_KEY_B64 }}
          CODEX_AUTH_CAPSULE_B64: ${{ secrets.CODEX_AUTH_CAPSULE_B64 }}
          CODEX_AUTH_CAPSULE_METADATA_B64: ${{ secrets.CODEX_AUTH_CAPSULE_METADATA_B64 }}
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/newsstand-semantic" "$RUNNER_TEMP/newsstand-semantic/codex"
          node scripts/restore-newsstand-cloud-custody.mjs "$RUNNER_TEMP/newsstand-semantic/codex"
      - name: Run exact source-bound pinned semantic producer
        id: semantic
        env:
          CODEX_HOME: ${{ runner.temp }}/newsstand-semantic/codex
          NEWSSTAND_PRIVATE_HANDOFF_KEY_B64: ${{ secrets.NEWSSTAND_PRIVATE_HANDOFF_KEY_B64 }}
          NEWSSTAND_SEMANTIC_PACKAGE_SHA256: ${{ secrets.NEWSSTAND_SEMANTIC_PACKAGE_SHA256 }}
          NEWSSTAND_SEMANTIC_PART_01: ${{ secrets.NEWSSTAND_SEMANTIC_PART_01 }}
          NEWSSTAND_SEMANTIC_PART_02: ${{ secrets.NEWSSTAND_SEMANTIC_PART_02 }}
          NEWSSTAND_SEMANTIC_PART_03: ${{ secrets.NEWSSTAND_SEMANTIC_PART_03 }}
          NEWSSTAND_SEMANTIC_PART_04: ${{ secrets.NEWSSTAND_SEMANTIC_PART_04 }}
          NEWSSTAND_SEMANTIC_PART_05: ${{ secrets.NEWSSTAND_SEMANTIC_PART_05 }}
          NEWSSTAND_SEMANTIC_PART_06: ${{ secrets.NEWSSTAND_SEMANTIC_PART_06 }}
          NEWSSTAND_SEMANTIC_PART_07: ${{ secrets.NEWSSTAND_SEMANTIC_PART_07 }}
          NEWSSTAND_SEMANTIC_PART_08: ${{ secrets.NEWSSTAND_SEMANTIC_PART_08 }}
        run: |
          set -euo pipefail
          npm install --global @openai/codex@0.153.4
          node scripts/run-newsstand-hosted-semantic-input.mjs "$RUNNER_TEMP/newsstand-semantic" "$RUNNER_TEMP/newsstand-semantic/result.enc"
      - name: Preserve encrypted semantic result
        if: always() && steps.semantic.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: newsstand-private-semantic-result-${{ github.run_id }}
          path: ${{ runner.temp }}/newsstand-semantic/result.enc
          if-no-files-found: error
          retention-days: 30
      - name: Seal refreshed dedicated session
        id: seal
        if: always() && steps.restore.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          NEWSSTAND_PRIVATE_HANDOFF_KEY_B64: ${{ secrets.NEWSSTAND_PRIVATE_HANDOFF_KEY_B64 }}
        run: |
          set -euo pipefail
          export AUTH_CUSTODY_WORKFLOW_ID="$(gh api repos/laidies/LAIDIES/actions/workflows/newsstand-cloud-intake.yml --jq '.id')"
          export AUTH_CUSTODY_RUN_ID="$GITHUB_RUN_ID"
          export AUTH_CUSTODY_RUN_STARTED_AT="$(gh api "repos/laidies/LAIDIES/actions/runs/$GITHUB_RUN_ID" --jq '.created_at')"
          export AUTH_CUSTODY_SOURCE_COMMIT="$GITHUB_SHA"
          export AUTH_CUSTODY_SOURCE_REF="$GITHUB_REF"
          node scripts/custody-codex-auth.mjs seal "$RUNNER_TEMP/newsstand-semantic/codex/auth.json" "$RUNNER_TEMP/newsstand-semantic/sealed/auth.enc" "$RUNNER_TEMP/newsstand-semantic/sealed/auth-meta.json"
      - name: Preserve encrypted refreshed custody
        if: always() && steps.seal.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: newsstand-codex-auth-current
          path: ${{ runner.temp }}/newsstand-semantic/sealed
          if-no-files-found: error
          retention-days: 90
      - name: Remove private runner files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/newsstand-semantic"
