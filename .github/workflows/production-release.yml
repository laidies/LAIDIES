name: Exact Cloudflare production release

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character source commit to release
        required: true
        type: string
      base_commit:
        description: Exact currently deployed source commit used for the production artifact comparison
        required: true
        type: string
      artifact_identity_sha256:
        description: Exact prepared candidate public-artifact identity
        required: true
        type: string
      approval_confirmation:
        description: APPROVE <artifact identity> FOR PRODUCTION
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: laidies-production-release
  cancel-in-progress: false

jobs:
  prepare-exact-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      BASE_COMMIT: ${{ inputs.base_commit }}
      EXPECTED_IDENTITY: ${{ inputs.artifact_identity_sha256 }}
      APPROVAL_CONFIRMATION: ${{ inputs.approval_confirmation }}
      APPROVER_LOGIN: ${{ vars.PRODUCTION_APPROVER_LOGIN }}
      CONTROLLER_SHA: ${{ vars.PRODUCTION_CONTROLLER_SHA }}
      ARTIFACT_DIR: ${{ github.workspace }}/.release/site
      RECEIPT_DIR: ${{ github.workspace }}/.release/receipt
      RELEASE_SCOPE_PATH: operations/release-control/sunday-production-scope-20260821.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify immutable source, controller and Ali-bound dispatch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BASE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_IDENTITY" =~ ^[a-f0-9]{64}$ ]]
          [[ "$CONTROLLER_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_ACTOR" = "$APPROVER_LOGIN"
          test "$APPROVAL_CONFIRMATION" = "APPROVE $EXPECTED_IDENTITY FOR PRODUCTION"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
          git cat-file -e "$BASE_COMMIT^{commit}"
          git cat-file -e "$CONTROLLER_SHA^{commit}"
          git merge-base --is-ancestor "$BASE_COMMIT" "$SOURCE_COMMIT"
          git diff --quiet "$CONTROLLER_SHA" "$SOURCE_COMMIT" -- \
            .github/workflows/production-release.yml \
            operations/release-control/public-entrypoints.json \
            operations/release-control/newsstand-production-scope.json \
            operations/release-control/sunday-production-scope-20260821.json \
            scripts/build-public-site.mjs \
            scripts/lib/active-asset-admission.mjs \
            scripts/compile-library-admission.mjs \
            scripts/library-correction-service.mjs \
            scripts/check-library-book-content-admission.mjs \
            scripts/render-library-book.mjs \
            scripts/lib/context-navigation-distribution-v1.mjs \
            scripts/lib/public-html-transform.mjs \
            scripts/lib/public-screening-room-admission.mjs \
            scripts/lib/public-runtime-family-admission.mjs \
            scripts/create-release-manifest.mjs \
            scripts/check-production-release-approval.mjs \
            scripts/check-newsstand-release-scope.mjs \
            scripts/test-newsstand-release-scope.mjs \
            scripts/check-sunday-release-scope.mjs \
            scripts/test-sunday-release-scope.mjs \
            scripts/validate-blend-snap-packs.mjs \
            scripts/test-validate-blend-snap-packs.mjs \
            scripts/test-blend-snap-browser.mjs \
            scripts/test-library-product.cjs \
            scripts/test-miss-jeeves-worker.mjs \
            scripts/test-production-release-controller.mjs \
            package.json \
            package-lock.json \
            scripts/test-compose-daily-edition.mjs \
            scripts/test-promote-daily-edition.mjs \
            scripts/test-daily-private-workflow.mjs \
            scripts/test-newsstand-canonical-migration.mjs \
            scripts/test-compile-newsstand-daily-longform.mjs \
            scripts/test-promote-newsstand-story.mjs \
            scripts/validate-newsstand-stories.mjs \
            scripts/test-newsstand-reader-contract.mjs \
            scripts/test-newsstand-reader-browser.mjs \
            scripts/test-newsstand-release-pipeline-v1.mjs
      - run: npm ci
      - name: Calibrate release controls
        run: |
          npm run test:production-release-controller
          node scripts/test-newsstand-release-scope.mjs
          node scripts/test-sunday-release-scope.mjs
      - name: Run exact Sunday correction checks
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export PLAYWRIGHT_CORE_PATH="$GITHUB_WORKSPACE/node_modules/playwright-core"
          node scripts/validate-blend-snap-packs.mjs
          node scripts/test-validate-blend-snap-packs.mjs
          node scripts/test-blend-snap-browser.mjs
          node scripts/test-library-product.cjs
          node scripts/test-miss-jeeves-worker.mjs
          npm run test:daily-private-pipeline
          npm run test:newsstand-canon
          node scripts/validate-newsstand-stories.mjs
          node scripts/test-newsstand-reader-contract.mjs
          NEWSSTAND_REQUIRE_BROWSER=1 node scripts/test-newsstand-reader-browser.mjs
          node scripts/test-newsstand-release-pipeline-v1.mjs
      - name: Build deployed baseline and candidate artifacts
        shell: bash
        run: |
          set -euo pipefail
          BASE_ARTIFACT_DIR="$RUNNER_TEMP/laidies-base-site"
          BASE_SOURCE_DIR="$RUNNER_TEMP/laidies-base-source"
          git worktree add --detach "$BASE_SOURCE_DIR" "$BASE_COMMIT"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$BASE_SOURCE_DIR/node_modules"
          node "$BASE_SOURCE_DIR/scripts/build-public-site.mjs" "$BASE_ARTIFACT_DIR"
          node scripts/build-public-site.mjs "$ARTIFACT_DIR"
          mkdir -p "$RECEIPT_DIR"
          node scripts/create-release-manifest.mjs "$BASE_ARTIFACT_DIR" "$RECEIPT_DIR/base-artifact-manifest.json"
          node scripts/create-release-manifest.mjs "$ARTIFACT_DIR" "$RECEIPT_DIR/artifact-manifest.json"
          actual_identity="$(jq -r .identitySha256 "$RECEIPT_DIR/artifact-manifest.json")"
          test "$actual_identity" = "$EXPECTED_IDENTITY"
          node scripts/check-sunday-release-scope.mjs \
            "$RECEIPT_DIR/base-artifact-manifest.json" \
            "$RECEIPT_DIR/artifact-manifest.json" \
            "$RELEASE_SCOPE_PATH" \
            "$RECEIPT_DIR/sunday-scope-receipt.json"
          cp "$RELEASE_SCOPE_PATH" "$RECEIPT_DIR/release-scope.json"
      - name: Bind exact artifact and approval
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg baseCommit "$BASE_COMMIT" \
            --arg artifactIdentitySha256 "$EXPECTED_IDENTITY" \
            --arg approvedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg confirmation "$APPROVAL_CONFIRMATION" \
            '{schema:"laidies.production-release-approval.v1",sourceCommit:$sourceCommit,baseCommit:$baseCommit,artifactIdentitySha256:$artifactIdentitySha256,approvedBy:"Ali",decision:"APPROVE_PRODUCTION_RELEASE",publicUrl:"https://laidies.ai/",approvedAt:$approvedAt,confirmation:$confirmation}' \
            > "$RECEIPT_DIR/approval.json"
          node scripts/check-production-release-approval.mjs "$RECEIPT_DIR/approval.json"
      - uses: actions/upload-artifact@v4
        with:
          name: production-release-site-${{ inputs.source_commit }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: production-release-receipt-${{ inputs.source_commit }}
          path: ${{ env.RECEIPT_DIR }}
          if-no-files-found: error
          retention-days: 90

  deploy-production:
    needs: prepare-exact-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.release.outputs.deployment_url }}
    permissions:
      contents: read
      deployments: write
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      PROJECT_NAME: laidies-sunnyvaile
      PRODUCTION_BRANCH: homepage-redesign
      ARTIFACT_DIR: ${{ github.workspace }}/.release/site
      RECEIPT_DIR: ${{ github.workspace }}/.release/receipt
      RELEASE_SCOPE_PATH: ${{ github.workspace }}/.release/receipt/release-scope.json
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production-release-site-${{ inputs.source_commit }}
          path: ${{ env.ARTIFACT_DIR }}
      - uses: actions/download-artifact@v4
        with:
          name: production-release-receipt-${{ inputs.source_commit }}
          path: ${{ env.RECEIPT_DIR }}
      - name: Deploy exact artifact to Cloudflare Pages production
        id: release
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.119.0 pages deployment list \
            --project-name "$PROJECT_NAME" --environment production --json > "$RECEIPT_DIR/deployments-before.json"
          npx --yes wrangler@4.119.0 pages deploy "$ARTIFACT_DIR" \
            --project-name "$PROJECT_NAME" \
            --branch "$PRODUCTION_BRANCH" \
            --commit-hash "$SOURCE_COMMIT" \
            --commit-message "Exact admitted Sunday correction release $SOURCE_COMMIT" \
            --commit-dirty=false
          npx --yes wrangler@4.119.0 pages deployment list \
            --project-name "$PROJECT_NAME" --environment production --json > "$RECEIPT_DIR/deployments-after.json"
          node - "$RECEIPT_DIR" "$SOURCE_COMMIT" "$PRODUCTION_BRANCH" <<'NODE'
          const fs=require('fs'),path=require('path');
          const [dir,commit,branch]=process.argv.slice(2);
          const before=JSON.parse(fs.readFileSync(path.join(dir,'deployments-before.json'),'utf8'));
          const after=JSON.parse(fs.readFileSync(path.join(dir,'deployments-after.json'),'utf8'));
          const prior=new Set(before.map(item=>item.id));
          const commitOf=item=>item?.source?.config?.commit_hash||item?.deployment_trigger?.metadata?.commit_hash;
          const branchOf=item=>item?.source?.config?.branch||item?.deployment_trigger?.metadata?.branch;
          const matches=after.filter(item=>!prior.has(item.id)&&commitOf(item)===commit&&branchOf(item)===branch);
          if(matches.length!==1||!matches[0]?.id||!matches[0]?.url) throw new Error(`expected one newly created exact production deployment, found ${matches.length}`);
          const deployment=matches[0];
          const receiptPath=path.join(dir,'deployment.json');
          fs.writeFileSync(receiptPath,JSON.stringify({schema:'laidies.cloudflare-production-deployment.v1',status:'DEPLOYED_AWAITING_PUBLIC_VERIFICATION',sourceCommit:commit,project:'laidies-sunnyvaile',productionBranch:branch,deploymentId:deployment.id,deploymentUrl:deployment.url.endsWith('/')?deployment.url:`${deployment.url}/`},null,2)+'\n');
          NODE
          deployment_url="$(jq -r .deploymentUrl "$RECEIPT_DIR/deployment.json")"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Verify immutable deployment and custom domain
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(jq -r .deploymentUrl "$RECEIPT_DIR/deployment.json")"
          validate_effective_url() {
            node - "$1" "$2" "$3" <<'NODE'
          const [baseValue, artifactPath, effectiveValue] = process.argv.slice(2);
          const base = new URL(baseValue);
          const effective = new URL(effectiveValue);
          const originalPath = `/${artifactPath}`;
          const canonicalPath = artifactPath === 'index.html'
            ? '/'
            : artifactPath.endsWith('.html')
              ? `/${artifactPath.slice(0, -5)}`
              : originalPath;
          if (effective.protocol !== 'https:' || effective.host !== base.host || ![originalPath, canonicalPath].includes(effective.pathname)) {
            throw new Error(`unexpected release redirect for ${artifactPath}: ${effective.href}`);
          }
          NODE
          }
          while IFS= read -r artifact_path; do
            expected="$(jq -r --arg path "$artifact_path" '.files[] | select(.path == $path) | .sha256' "$RECEIPT_DIR/artifact-manifest.json")"
            [[ "$expected" =~ ^[a-f0-9]{64}$ ]]
            curl --fail --silent --show-error --retry 8 --retry-all-errors \
              --location --proto-redir '=https' --max-redirs 3 \
              --output "$RUNNER_TEMP/immutable.bin" --write-out '%{url_effective}' \
              "${deployment_url}${artifact_path}?release=${SOURCE_COMMIT}" > "$RUNNER_TEMP/immutable.final-url"
            validate_effective_url "$deployment_url" "$artifact_path" "$(cat "$RUNNER_TEMP/immutable.final-url")"
            test "$(sha256sum "$RUNNER_TEMP/immutable.bin" | cut -d' ' -f1)" = "$expected"
            curl --fail --silent --show-error --retry 12 --retry-all-errors \
              --location --proto-redir '=https' --max-redirs 3 \
              -H 'Cache-Control: no-cache' \
              --output "$RUNNER_TEMP/custom-domain.bin" --write-out '%{url_effective}' \
              "https://laidies.ai/${artifact_path}?release=${SOURCE_COMMIT}" > "$RUNNER_TEMP/custom-domain.final-url"
            validate_effective_url "https://laidies.ai/" "$artifact_path" "$(cat "$RUNNER_TEMP/custom-domain.final-url")"
            test "$(sha256sum "$RUNNER_TEMP/custom-domain.bin" | cut -d' ' -f1)" = "$expected"
          done < <(jq -r '.verificationPaths[]' "$RELEASE_SCOPE_PATH")
          while IFS= read -r artifact_path; do
            immutable_result="$(curl --silent --show-error --location --proto-redir '=https' --max-redirs 3 \
              --output /dev/null --write-out '%{http_code}\n%{url_effective}' \
              "${deployment_url}${artifact_path}?release=${SOURCE_COMMIT}")"
            test "$(printf '%s\n' "$immutable_result" | sed -n '1p')" = 404
            validate_effective_url "$deployment_url" "$artifact_path" "$(printf '%s\n' "$immutable_result" | sed -n '2p')"
            custom_result="$(curl --silent --show-error --location --proto-redir '=https' --max-redirs 3 \
              -H 'Cache-Control: no-cache' --output /dev/null --write-out '%{http_code}\n%{url_effective}' \
              "https://laidies.ai/${artifact_path}?release=${SOURCE_COMMIT}")"
            test "$(printf '%s\n' "$custom_result" | sed -n '1p')" = 404
            validate_effective_url "https://laidies.ai/" "$artifact_path" "$(printf '%s\n' "$custom_result" | sed -n '2p')"
          done < <(jq -r '.removedPaths[]' "$RELEASE_SCOPE_PATH")
          test "$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' https://laidies.ai/operations/ACTIVE-WORK.md)" = 404
          test "$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' https://laidies.ai/operations/COMMIT-QUEUE.md)" = 404
          jq '.status="DEPLOYED_AND_VERIFIED_PUBLICLY" | .verifiedAt=(now|todateiso8601) | .publicUrl="https://laidies.ai/"' \
            "$RECEIPT_DIR/deployment.json" > "$RECEIPT_DIR/deployment.verified.json"
          mv "$RECEIPT_DIR/deployment.verified.json" "$RECEIPT_DIR/deployment.json"
      - name: Upload exact public verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: production-release-public-verification-${{ inputs.source_commit }}
          path: ${{ env.RECEIPT_DIR }}
          if-no-files-found: error
          retention-days: 90
