name: Legacy Hot Goss Intake (manual inspection only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-review-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser anthropic

      - name: Run legacy intake (may retain previous feed)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update-hot-goss.py

      - name: Upload legacy output for inspection (not admitted)
        uses: actions/upload-artifact@v4
        with:
          name: hot-goss-inspection-output
          path: content/hot-goss-feed.json
          retention-days: 7
