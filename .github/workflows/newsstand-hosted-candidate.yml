name: NewsStand full hosted candidate exercise
on:
  push:
    branches: [ops/newsstand-hosted-20260926]
    paths:
      - .github/workflows/newsstand-hosted-candidate.yml
      - scripts/exercise-newsstand-hosted-candidate.mjs
      - operations/product-stewards/newsstand/hosted-publishing-20260926/candidate-exercise.enc
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: newsstand-hosted-candidate
  cancel-in-progress: false
jobs:
  exercise:
    if: github.repository == 'laidies/LAIDIES' && github.ref == 'refs/heads/ops/newsstand-hosted-20260926'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify private runtime and subprocess boundaries
        run: |
          node scripts/test-materialize-newsstand-hosted-runtime.mjs
          node scripts/test-review-newsstand-hosted-candidate.mjs
          node scripts/test-newsstand-hosted-protocol.mjs
      - name: Install pinned isolated reviewer
        run: npm install --global @anthropic-ai/claude-code@2.1.251
      - name: Decrypt exact candidate runtime
        env:
          NEWSSTAND_PRIVATE_HANDOFF_KEY_B64: ${{ secrets.NEWSSTAND_PRIVATE_HANDOFF_KEY_B64 }}
        run: |
          mkdir -m 700 "$RUNNER_TEMP/newsstand-candidate"
          cp operations/product-stewards/newsstand/hosted-publishing-20260926/candidate-exercise.enc "$RUNNER_TEMP/newsstand-candidate/input.enc"
          cd "$RUNNER_TEMP"
          node "$GITHUB_WORKSPACE/scripts/newsstand-private-envelope.mjs" decrypt --input newsstand-candidate/input.enc --output newsstand-candidate/input.gz --context laidies-newsstand --schema candidate-exercise-input-v1 --run-purpose hosted-candidate-exercise-20260926
      - name: Execute all candidate preflight and real independent editorial review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/exercise-newsstand-hosted-candidate.mjs "$RUNNER_TEMP/newsstand-candidate/input.gz" "$RUNNER_TEMP/newsstand-candidate/exercise"
      - name: Preserve authenticated private review evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NEWSSTAND_PRIVATE_HANDOFF_KEY_B64: ${{ secrets.NEWSSTAND_PRIVATE_HANDOFF_KEY_B64 }}
        run: |
          if [[ -d "$RUNNER_TEMP/newsstand-candidate/exercise/evidence" ]]; then
            node scripts/preserve-newsstand-hosted-candidate.mjs "$RUNNER_TEMP/newsstand-candidate/exercise/evidence"
          fi
      - name: Remove ephemeral private candidate
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/newsstand-candidate"
