name: Exact Library preview

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit to build
        required: true
        type: string
      library_sha256:
        description: Expected SHA-256 of library.html at that commit
        required: true
        type: string
      deploy_preview:
        description: Deploy to the protected Cloudflare Pages preview environment
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  exact-library-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARTIFACT_DIR: ${{ github.workspace }}/.artifacts/laidies-public-site
      RECEIPT_DIR: ${{ github.workspace }}/.artifacts/laidies-preview-receipt
      PROJECT_NAME: laidies-sunnyvaile-preview
      INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
      INPUT_LIBRARY_SHA256: ${{ inputs.library_sha256 }}
      CONTROLLER_SHA: ${{ vars.PREVIEW_CONTROLLER_SHA }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify immutable source and Library candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$INPUT_COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$INPUT_LIBRARY_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$CONTROLLER_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$INPUT_COMMIT_SHA"
          test "$(sha256sum library.html | cut -d' ' -f1)" = "$INPUT_LIBRARY_SHA256"
          test -z "$(git status --porcelain)"
          git cat-file -e "$CONTROLLER_SHA^{commit}"
          git diff --quiet "$CONTROLLER_SHA" "$INPUT_COMMIT_SHA" -- \
            .github/workflows/exact-library-preview.yml \
            package.json package-lock.json scripts .codex/hooks operations/hooks operations/engine
      - name: Install locked dependencies
        run: npm ci
      - name: Install pinned browser runtime for Library visitor checks
        shell: bash
        run: |
          set -euo pipefail
          npm install --global playwright-core@1.62.1
          npx --yes playwright@1.62.1 install --with-deps chromium
          playwright_root="$(npm root --global)"
          chromium_path="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chromium-*' -print -quit)"
          test -f "$playwright_root/playwright-core/package.json"
          test -x "$chromium_path"
          echo "PLAYWRIGHT_CORE_PATH=$playwright_root/playwright-core" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$chromium_path" >> "$GITHUB_ENV"
      - name: Minimum integrity CI
        run: npm run ci
      - name: Library product and responsive browser checks
        run: node scripts/test-library-product.cjs && node scripts/test-library-modular-reading-system.mjs
      - name: Prove the old inline-handler defect is rejected
        shell: bash
        run: |
          set -euo pipefail
          if LIBRARY_INLINE_HANDLER_CALIBRATION=inline-submit node scripts/test-library-product.cjs > calibration.log 2>&1; then
            cat calibration.log
            echo 'Calibration unexpectedly passed' >&2
            exit 1
          fi
          grep -F 'Library uses closure-local listeners instead of inline event handlers' calibration.log
      - name: Exact visual and product review admission
        run: node scripts/check-design-review-admission.mjs
      - name: Build curated public artifact
        run: node scripts/build-public-site.mjs "$ARTIFACT_DIR"
      - name: Create exact artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RECEIPT_DIR"
          node scripts/create-release-manifest.mjs "$ARTIFACT_DIR" "$RECEIPT_DIR/artifact-manifest.json"
      - name: Write prepared receipt
        shell: bash
        run: |
          set -euo pipefail
          identity="$(node -p "require('$RECEIPT_DIR/artifact-manifest.json').identitySha256")"
          artifact_candidate="$(node -p "require('$RECEIPT_DIR/artifact-manifest.json').files.find(file=>file.path==='library.html').sha256")"
          jq -n \
            --arg commit "$INPUT_COMMIT_SHA" \
            --arg source_candidate "$INPUT_LIBRARY_SHA256" \
            --arg artifact_candidate "$artifact_candidate" \
            --arg identity "$identity" \
            '{schema:"laidies.exact-commit-preview.v1",status:"PREPARED_NO_DEPLOY",source_commit:$commit,project:"laidies-sunnyvaile-preview",candidate:{path:"library.html",source_sha256:$source_candidate,artifact_sha256:$artifact_candidate},artifact_manifest:{path:"artifact-manifest.json",identity_sha256:$identity},deployment_id:null,preview_url:null,access_credential:null,checks:[{id:"minimum-integrity-ci",result:"PASS"},{id:"library-product-browser",result:"PASS"},{id:"library-inline-handler-calibration",result:"PASS"},{id:"design-review-admission",result:"PASS"},{id:"curated-public-build",result:"PASS"}]}' \
            > "$RECEIPT_DIR/preview-receipt.json"
          node scripts/check-exact-commit-preview.mjs "$RECEIPT_DIR/preview-receipt.json"
      - name: Upload exact candidate and receipt
        uses: actions/upload-artifact@v4
        with:
          name: exact-library-preview-${{ inputs.commit_sha }}
          path: |
            ${{ env.ARTIFACT_DIR }}
            ${{ env.RECEIPT_DIR }}
          if-no-files-found: error
          retention-days: 7

  deploy-preview:
    if: ${{ inputs.deploy_preview }}
    needs: exact-library-preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    env:
      DOWNLOAD_DIR: ${{ github.workspace }}/.artifacts/exact-library-preview
      ARTIFACT_DIR: ${{ github.workspace }}/.artifacts/exact-library-preview/laidies-public-site
      RECEIPT_DIR: ${{ github.workspace }}/.artifacts/exact-library-preview/laidies-preview-receipt
      PROJECT_NAME: laidies-sunnyvaile-preview
      INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: exact-library-preview-${{ inputs.commit_sha }}
          path: ${{ env.DOWNLOAD_DIR }}
      - name: Validate prepared artifact and existing Access policy
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCESS_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$PROJECT_NAME" = "laidies-sunnyvaile-preview"
          jq -e --arg commit "$INPUT_COMMIT_SHA" '
            .schema == "laidies.exact-commit-preview.v1" and
            .status == "PREPARED_NO_DEPLOY" and
            .source_commit == $commit and
            .project == "laidies-sunnyvaile-preview" and
            .candidate.path == "library.html" and
            .deployment_id == null and .preview_url == null and .access_credential == null and
            ([.checks[] | select(.result == "PASS") | .id] | sort | unique) ==
              ["curated-public-build","design-review-admission","library-inline-handler-calibration","library-product-browser","minimum-integrity-ci"]
          ' "$RECEIPT_DIR/preview-receipt.json" >/dev/null
          access_apps="/tmp/library-access-apps-${GITHUB_RUN_ID}.json"
          access_policies="/tmp/library-access-policies-${GITHUB_RUN_ID}.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_ACCESS_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps" \
            > "$access_apps"
          access_app_id="$(jq -er --arg domain "*.$PROJECT_NAME.pages.dev" '
            select(.success == true) |
            [.result[] | select(.domain == $domain)] |
            if length == 1 then .[0].id else error("expected one exact preview Access application") end
          ' "$access_apps")"
          [[ "$access_app_id" =~ ^[a-f0-9-]{36}$ ]]
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_ACCESS_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps/$access_app_id/policies" \
            > "$access_policies"
          jq -e '
            .success == true and
            any(.result[];
              .decision == "non_identity" and
              any(.include[]?; has("any_valid_service_token"))
            )
          ' "$access_policies" >/dev/null
          rm -f "$access_apps" "$access_policies"
      - name: Create masked temporary Access verification credential
        shell: bash
        env:
          CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response="/tmp/library-access-token-${GITHUB_RUN_ID}.json"
          service_token_id=""
          cleanup_on_error() {
            exit_code=$?
            trap - EXIT
            if [[ "$exit_code" -ne 0 && -n "$service_token_id" ]]; then
              curl --fail --silent --show-error --request DELETE \
                --header "Authorization: Bearer $CLOUDFLARE_ACCESS_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/service_tokens/$service_token_id" \
                >/dev/null || true
            fi
            rm -f "$response"
            exit "$exit_code"
          }
          trap cleanup_on_error EXIT
          token_name="laidies-library-preview-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_ACCESS_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$(jq -nc --arg name "$token_name" '{name:$name,duration:"30m"}')" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/service_tokens" \
            > "$response"
          service_token_id="$(jq -r '.result.id // empty' "$response")"
          jq -e '
            .success == true and
            (.result.id | type == "string" and length == 36) and
            (.result.client_id | type == "string" and length > 0) and
            (.result.client_secret | type == "string" and length > 0) and
            .result.duration == "30m"
          ' "$response" >/dev/null
          client_id="$(jq -r .result.client_id "$response")"
          client_secret="$(jq -r .result.client_secret "$response")"
          echo "::add-mask::$client_id"
          echo "::add-mask::$client_secret"
          {
            echo "CF_ACCESS_SERVICE_TOKEN_ID=$service_token_id"
            echo "CF_ACCESS_CLIENT_ID=$client_id"
            echo "CF_ACCESS_CLIENT_SECRET=$client_secret"
          } >> "$GITHUB_ENV"
          rm -f "$response"
          trap - EXIT
      - name: Deploy and byte-verify exact protected preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$PROJECT_NAME" = "laidies-sunnyvaile-preview"
          [[ "$CF_ACCESS_SERVICE_TOKEN_ID" =~ ^[a-f0-9-]{36}$ ]]
          pages_auth_header="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl --fail --silent --show-error \
            --header "$pages_auth_header" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME/deployments?page=1&per_page=15" \
            > "$RECEIPT_DIR/deployments-before-response.json"
          jq -e '.success == true and (.result | type == "array")' "$RECEIPT_DIR/deployments-before-response.json" >/dev/null
          jq -e '.result' "$RECEIPT_DIR/deployments-before-response.json" > "$RECEIPT_DIR/deployments-before.json"
          review_branch="review-${INPUT_COMMIT_SHA:0:12}-${GITHUB_RUN_ID}"
          npx --yes wrangler@4.119.0 pages deploy "$ARTIFACT_DIR" \
            --project-name "$PROJECT_NAME" \
            --branch "$review_branch" \
            --commit-hash "$INPUT_COMMIT_SHA" \
            --commit-dirty=false
          deployment_visible=false
          for attempt in $(seq 1 10); do
            curl --fail --silent --show-error \
              --header "$pages_auth_header" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME/deployments?page=1&per_page=15" \
              > "$RECEIPT_DIR/deployments-after-response.json"
            jq -e '.success == true and (.result | type == "array")' "$RECEIPT_DIR/deployments-after-response.json" >/dev/null
            jq -e '.result' "$RECEIPT_DIR/deployments-after-response.json" > "$RECEIPT_DIR/deployments-after.json"
            if node - "$RECEIPT_DIR" "$INPUT_COMMIT_SHA" "$review_branch" "$CF_ACCESS_SERVICE_TOKEN_ID" <<'NODE'
          const fs=require('fs'),path=require('path');
          const [dir,commit,branch,serviceTokenId]=process.argv.slice(2);
          const before=JSON.parse(fs.readFileSync(path.join(dir,'deployments-before.json'),'utf8'));
          const after=JSON.parse(fs.readFileSync(path.join(dir,'deployments-after.json'),'utf8'));
          const prior=new Set(before.map(item=>item.id));
          const commitOf=item=>item?.source?.config?.commit_hash||item?.deployment_trigger?.metadata?.commit_hash;
          const branchOf=item=>item?.source?.config?.branch||item?.deployment_trigger?.metadata?.branch;
          const matches=after.filter(item=>!prior.has(item.id)&&branchOf(item)===branch);
          const conflicting=matches.filter(item=>commitOf(item)&&commitOf(item)!==commit);
          if(conflicting.length) throw new Error(`new preview deployment exposed conflicting provider commit metadata: ${conflicting.map(item=>commitOf(item)).join(',')}`);
          if(matches.length===0) process.exit(2);
          if(matches.length!==1||!matches[0]?.id||!matches[0]?.url) throw new Error(`expected one newly created exact preview deployment, found ${matches.length}`);
          const deployment=matches[0];
          const providerCommit=commitOf(deployment)||null;
          const receiptPath=path.join(dir,'preview-receipt.json');
          const receipt=JSON.parse(fs.readFileSync(receiptPath,'utf8'));
          receipt.status='DEPLOYED_PREVIEW';receipt.deployment_id=deployment.id;receipt.preview_url=deployment.url.endsWith('/')?deployment.url:`${deployment.url}/`;receipt.review_branch=branch;receipt.deployment_provider_commit=providerCommit;receipt.deployment_provider_commit_verified=providerCommit===commit;receipt.deployment_identity_basis=providerCommit?'new-id+branch+provider-commit':'new-id+branch+exact-byte-verification';receipt.access_credential={type:'TEMPORARY_SERVICE_TOKEN',service_token_id:serviceTokenId,duration:'30m',policy_selector:'any_valid_service_token',revoked:false};
          fs.writeFileSync(receiptPath,JSON.stringify(receipt,null,2)+'\n');
          NODE
            then
              deployment_visible=true
              break
            else
              resolver_status=$?
              if [[ "$resolver_status" -ne 2 || "$attempt" -eq 10 ]]; then
                echo "Exact preview deployment did not become uniquely visible after $attempt attempt(s)." >&2
                exit "$resolver_status"
              fi
              sleep 3
            fi
          done
          test "$deployment_visible" = true
          preview_url="$(jq -r .preview_url "$RECEIPT_DIR/preview-receipt.json")"
          deployment_id="$(jq -r .deployment_id "$RECEIPT_DIR/preview-receipt.json")"
          [[ "$preview_url" == "https://${deployment_id:0:8}.$PROJECT_NAME.pages.dev/" ]]
          unauthenticated_status="$(curl --silent --show-error --output /dev/null --max-redirs 0 --write-out '%{http_code}' "${preview_url}library.html")"
          [[ "$unauthenticated_status" == 302 || "$unauthenticated_status" == 401 || "$unauthenticated_status" == 403 ]]
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "${preview_url}library.html" > "$RECEIPT_DIR/deployed-library.html"
          deployed_library_sha="$(sha256sum "$RECEIPT_DIR/deployed-library.html" | cut -d' ' -f1)"
          expected_library_sha="$(jq -r .candidate.artifact_sha256 "$RECEIPT_DIR/preview-receipt.json")"
          test "$deployed_library_sha" = "$expected_library_sha"
          jq --arg sha "$deployed_library_sha" --arg unauthenticated "$unauthenticated_status" '.public_verification={route:"/library.html",http_status:200,unauthenticated_status:($unauthenticated|tonumber),access_protected:true,sha256:$sha,result:"PASS"}' \
            "$RECEIPT_DIR/preview-receipt.json" > "$RECEIPT_DIR/preview-receipt.updated.json"
          mv "$RECEIPT_DIR/preview-receipt.updated.json" "$RECEIPT_DIR/preview-receipt.json"
      - name: Revoke temporary Access verification credential
        if: ${{ always() }}
        shell: bash
        env:
          CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CF_ACCESS_SERVICE_TOKEN_ID:-}" ]]; then
            exit 0
          fi
          revoke_response="/tmp/library-access-token-revoke-${GITHUB_RUN_ID}.json"
          curl --fail --silent --show-error --request DELETE \
            --header "Authorization: Bearer $CLOUDFLARE_ACCESS_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/service_tokens/$CF_ACCESS_SERVICE_TOKEN_ID" \
            > "$revoke_response"
          jq -e '.success == true' "$revoke_response" >/dev/null
          rm -f "$revoke_response"
          if jq -e '.status == "DEPLOYED_PREVIEW" and .access_credential.service_token_id != null' "$RECEIPT_DIR/preview-receipt.json" >/dev/null 2>&1; then
            jq '.access_credential.revoked = true' \
              "$RECEIPT_DIR/preview-receipt.json" > "$RECEIPT_DIR/preview-receipt.revoked.json"
            mv "$RECEIPT_DIR/preview-receipt.revoked.json" "$RECEIPT_DIR/preview-receipt.json"
          fi
      - name: Verify deployed receipt after credential revocation
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .schema == "laidies.exact-commit-preview.v1" and
            .status == "DEPLOYED_PREVIEW" and
            .project == "laidies-sunnyvaile-preview" and
            .access_credential.type == "TEMPORARY_SERVICE_TOKEN" and
            .access_credential.duration == "30m" and
            .access_credential.policy_selector == "any_valid_service_token" and
            .access_credential.revoked == true and
            .public_verification.route == "/library.html" and
            .public_verification.http_status == 200 and
            .public_verification.access_protected == true and
            .public_verification.result == "PASS"
          ' "$RECEIPT_DIR/preview-receipt.json" >/dev/null
      - name: Upload deployed preview receipt
        uses: actions/upload-artifact@v4
        with:
          name: exact-library-preview-deployed-${{ inputs.commit_sha }}
          path: ${{ env.RECEIPT_DIR }}
          if-no-files-found: error
          retention-days: 7
