name: NewsStand hosted runtime pilot

on:
  push:
    branches: [ops/newsstand-hosted-20260926]
    paths:
      - .github/workflows/newsstand-hosted-pilot.yml
      - scripts/*newsstand-hosted*.mjs
      - operations/product-stewards/newsstand/hosted-publishing-20260926/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newsstand-hosted-pilot
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts
            operations/release-control
            operations/product-stewards/newsstand/hosted-publishing-20260926
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test hosted failure handling
        run: |
          node scripts/test-newsstand-hosted-readiness.mjs
          node scripts/test-newsstand-hosted-claude.mjs
          node scripts/test-newsstand-hosted-release.mjs
          node scripts/test-newsstand-hosted-provider.mjs
      - name: Report actual migration readiness
        shell: bash
        run: |
          set +e
          node scripts/check-newsstand-hosted-readiness.mjs > "$RUNNER_TEMP/newsstand-readiness.json"
          result=$?
          set -e
          cat "$RUNNER_TEMP/newsstand-readiness.json"
          {
            echo '## NewsStand migration readiness'
            echo 'This pilot checks dependencies. It does not research, write, review or publish an article.'
            echo '```json'
            cat "$RUNNER_TEMP/newsstand-readiness.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"

  model-transport:
    # Enable only after Ali authorizes the new persistent Claude token.
    if: vars.NEWSSTAND_HOSTED_MODEL_PROBE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Claude CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.251
      - name: Exercise isolated writer and reviewer sessions
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/probe-newsstand-hosted-claude.mjs

  provider-access:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify existing hosted Cloudflare access without deploying
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/read-newsstand-hosted-provider.mjs
