name: Operating baseline CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  work-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Recovery checkpoints verify immutable ancestor commits.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Active asset revocation calibration
        run: node scripts/test-active-asset-admission.mjs
      - name: GitHub Pages release-boundary calibration
        run: npm run test:pages-release-boundary
      - name: Block automatic main-to-production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" > "$RUNNER_TEMP/pages-config.json"
          node scripts/check-github-pages-release-boundary.mjs "$RUNNER_TEMP/pages-config.json"
      - name: Production release controller calibration
        run: npm run test:production-release-controller
      - name: Laptop-independent NewsStand intake calibration
        run: npm run test:newsstand-cloud-intake
      - name: Append-only work truth and calibration
        run: |
          node scripts/test-project-work-events.mjs
          node scripts/project-work-events.mjs >/dev/null
      - name: Bounded context retrieval calibration
        run: node scripts/test-query-laidies-context.mjs
      - name: Hosted handoff contract calibration
        run: node worker-operating-pilot/test-contract.mjs
      - name: Feedback input and private receipt calibration
        run: |
          node worker-operating-pilot/test-feedback-contract.mjs
          node worker-operating-pilot/test-feedback-http.mjs
          node worker-operating-pilot/test-feedback-client.mjs
          node worker-operating-pilot/test-private-feedback.mjs
          node worker-operating-pilot/build-private-feedback.mjs
      - name: Founder decision and bounded resumption calibration
        run: node worker-operating-pilot/test-founder.mjs
      - name: Private decision database and workflow integration
        run: |
          npm install --prefix "$RUNNER_TEMP/laidies-decision-db" --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.3.16
          PGLITE_MODULE_PATH="$RUNNER_TEMP/laidies-decision-db/node_modules/@electric-sql/pglite/dist/index.js" node worker-operating-pilot/test-database.mjs
          PGLITE_MODULE_PATH="$RUNNER_TEMP/laidies-decision-db/node_modules/@electric-sql/pglite/dist/index.js" node worker-operating-pilot/test-feedback-database.mjs
          PGLITE_MODULE_PATH="$RUNNER_TEMP/laidies-decision-db/node_modules/@electric-sql/pglite/dist/index.js" node worker-operating-pilot/test-feedback-integration.mjs
          PGLITE_MODULE_PATH="$RUNNER_TEMP/laidies-decision-db/node_modules/@electric-sql/pglite/dist/index.js" node worker-operating-pilot/test-feedback-staging.mjs
          PGLITE_MODULE_PATH="$RUNNER_TEMP/laidies-decision-db/node_modules/@electric-sql/pglite/dist/index.js" node worker-operating-pilot/test-feedback-private-db.mjs
      - name: Hosted handoff real runtime calibration
        run: node worker-operating-pilot/test-runtime.mjs
      - name: Artifact handoff and commit binding
        run: node scripts/test-artifact-handoff.mjs
      - name: Role-distinct review routing
        run: node scripts/test-agent-role-routing.mjs
      - name: Workspace configuration reproducibility
        run: node scripts/test-sync-codex-workspace-config.mjs
      - name: Local push protection calibration
        run: node scripts/test-pre-push-protection.mjs
      - name: Codex lifecycle hook guards
        run: node scripts/test-codex-hook-guards.mjs
