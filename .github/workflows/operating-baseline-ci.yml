name: Operating baseline CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  work-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: GitHub Pages release-boundary calibration
        run: npm run test:pages-release-boundary
      - name: Block automatic main-to-production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" > "$RUNNER_TEMP/pages-config.json"
          node scripts/check-github-pages-release-boundary.mjs "$RUNNER_TEMP/pages-config.json"
      - name: Append-only work truth and calibration
        run: |
          node scripts/test-project-work-events.mjs
          node scripts/project-work-events.mjs >/dev/null
      - name: Artifact handoff and commit binding
        run: node scripts/test-artifact-handoff.mjs
      - name: Role-distinct review routing
        run: node scripts/test-agent-role-routing.mjs
      - name: Workspace configuration reproducibility
        run: node scripts/test-sync-codex-workspace-config.mjs
      - name: Local push protection calibration
        run: node scripts/test-pre-push-protection.mjs
      - name: Codex lifecycle hook guards
        run: node scripts/test-codex-hook-guards.mjs
