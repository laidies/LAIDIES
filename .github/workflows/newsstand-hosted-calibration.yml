name: NewsStand hosted blind editorial qualification
on:
  push:
    branches: [ops/newsstand-hosted-20260926]
    paths:
      - .github/workflows/newsstand-hosted-calibration.yml
      - scripts/calibrate-newsstand-hosted.mjs
      - operations/product-stewards/newsstand/hosted-publishing-20260926/calibration-input.enc
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: newsstand-hosted-calibration
  cancel-in-progress: false
jobs:
  calibrate:
    if: github.repository == 'laidies/LAIDIES' && github.ref == 'refs/heads/ops/newsstand-hosted-20260926'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            operations/product-stewards/newsstand/hosted-publishing-20260926
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check isolation and encrypted handoff
        run: |
          node scripts/test-newsstand-hosted-protocol.mjs
          node scripts/test-newsstand-hosted-editorial.mjs
          node scripts/test-newsstand-private-envelope.mjs
      - name: Install pinned Claude CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.251
      - name: Decrypt exact private calibration input
        env:
          NEWSSTAND_PRIVATE_HANDOFF_KEY_B64: ${{ secrets.NEWSSTAND_PRIVATE_HANDOFF_KEY_B64 }}
        run: |
          mkdir -m 700 "$RUNNER_TEMP/newsstand-calibration"
          cp operations/product-stewards/newsstand/hosted-publishing-20260926/calibration-input.enc "$RUNNER_TEMP/newsstand-calibration/input.enc"
          cd "$RUNNER_TEMP"
          node "$GITHUB_WORKSPACE/scripts/newsstand-private-envelope.mjs" decrypt --input newsstand-calibration/input.enc --output newsstand-calibration/input.json --context laidies-newsstand --schema calibration-input-v1 --purpose hosted-qualification-20260926
      - name: Exercise complete blind editorial qualification
        id: calibration
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          node scripts/test-newsstand-hosted-calibration.mjs --bundle "$RUNNER_TEMP/newsstand-calibration/input.json"
          node scripts/calibrate-newsstand-hosted.mjs "$RUNNER_TEMP/newsstand-calibration/input.json" "$RUNNER_TEMP/newsstand-calibration/result"
      - name: Preserve encrypted judgments for exact review
        if: always() && steps.calibration.outcome != 'skipped'
        env:
          NEWSSTAND_PRIVATE_HANDOFF_KEY_B64: ${{ secrets.NEWSSTAND_PRIVATE_HANDOFF_KEY_B64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/preserve-newsstand-hosted-calibration.mjs "$RUNNER_TEMP/newsstand-calibration/result"
      - name: Remove ephemeral private input and output
        if: always()
        run: rm -rf "$RUNNER_TEMP/newsstand-calibration"
