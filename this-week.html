<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAiDIES · Latest episode</title>
  <meta name="robots" content="noindex">
  <style>body{font-family:Georgia,serif;padding:3rem;color:#4b2148;background:#fffdfb}a{color:inherit}</style>
</head>
<body>
  <p><a id="episode" href="/issues/issue-04.html">Latest episode →</a></p>
  <script>
    (function () {
      var link = document.getElementById('episode');
      var params = new URLSearchParams(location.search);
      if (params.get('bag') === 'open') {
        link.href = '/blend-snap.html' + (/^\d+$/.test(params.get('issue') || '') ? '?issue=' + Number(params.get('issue')) : '') + '#the-study-pack';
        location.replace(link.href);
        return;
      }
      var timer = setTimeout(function () { location.replace(link.href); }, 2500);
      fetch('/content/episode-index.json', {cache:'no-cache'}).then(function (response) {
        if (!response.ok) throw new Error('Episode index unavailable');
        return response.json();
      }).then(function (data) {
        var episodes = (data.episodes || []).filter(function (episode) {
          return episode.status === 'published' && Number.isInteger(Number(episode.number)) && Number(episode.number) > 0 &&
            typeof episode.title === 'string' && episode.title.trim() &&
            /^issues\/issue-[a-z0-9-]+\.html$/i.test(episode.issueUrl || '');
        }).sort(function (a,b) { return Number(b.number)-Number(a.number); });
        if (episodes.length) link.href = '/' + episodes[0].issueUrl;
      }).catch(function () {}).finally(function () {
        clearTimeout(timer);
        location.replace(link.href);
      });
    })();
  </script>
</body>
</html>
